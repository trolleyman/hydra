          enum: [queue]
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatQueuedMessage'

    ChatPendingQuestionsFrame:
      type: object
      description: >-
        Which question cards can still be answered. A question's request id is
        durable and replays forever, but the request behind it dies with the
        turn that raised it, so the client cannot tell a live card from a dead
        one on its own. An empty list is a definite none; the frame being
        omitted entirely means the daemon cannot say.
      required: [type, requests]
      properties:
        type:
          type: string
          enum: [pending_questions]
        requests:
          type: array
          items:
            $ref: '#/components/schemas/ChatPendingAsk'

    ChatQuestionExpiredFrame:
      type: object
      description: >-
        An answer was dropped because its request had already been retired. The
        card flips to expired rather than settling on an "Answered" that never
        was.
      required: [type, requestId]
      properties:
        type:
          type: string
          enum: [question_expired]
        requestId:
          type: string

    ChatShellOutputFrame:
      type: object
      description: >-
        A live chunk of a running composer "!command", keyed by the send frame's
        id. Ephemeral - the durable record is the user_message it settles into.
      required: [type, id, chunk]
      properties:
        type:
          type: string
          enum: [shell_output]
        id:
          x-go-type-skip-optional-pointer: true
          type: string
        chunk:
          type: string

    ChatTaskOutputFrame:
      type: object
      description: The tail of a background task's output file, or why it could not be read.
      required: [type, file]
      properties:
        type:
          type: string
          enum: [task_output]
        file:
          x-go-type-skip-optional-pointer: true
          type: string
        content:
          x-go-type-skip-optional-pointer: true
          type: string
        error:
          x-go-type-skip-optional-pointer: true
          type: string

    ChatErrorFrame:
      type: object
      description: >-
        This head's normalized event log could not be opened, so the connection
        will render nothing. There is no fallback to degrade to, and an empty
        transcript is indistinguishable from a head that never spoke.
      required: [type, error]
      properties:
        type:
          type: string
          enum: [chat_error]
        error:
          x-go-type-skip-optional-pointer: true
          type: string

    ChatClientMessage:
      type: object
      description: >-
        One client-to-server frame on a chat-mode socket. Flat rather than a
        union: `type` selects which of the optional fields carry meaning.
      required: [type]
      properties:
        type:
          type: string
          enum:
            - user_message
            - interrupt
            - set_model
            - control_response
            - shell_command
            - shell_stop
            - dequeue
            - load_events_before
            - load_subagent
            - task_output
        id:
          x-go-type-skip-optional-pointer: true
          type: string
          description: >-
            The client-generated id of a user_message, or the dequeue/shell_stop
            target, so a queued message can be reconciled and recalled.
        queued:
          x-go-type-skip-optional-pointer: true
          type: boolean
          description: >-
            Set on a user_message sent while a turn runs: the daemon HOLDS it
            rather than delivering now, and drains it when the turn ends.
        cursor:
          x-go-type-skip-optional-pointer: true
          type: string
          description: >-
            The history cursor of a load_events_before request - the daemon
