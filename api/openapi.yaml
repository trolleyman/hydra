openapi: 3.0.3
info:
  title: Hydra API
  version: 1.0.0

paths:
  /.well-known/appspecific/com.chrome.devtools.json:
    get:
      summary: Chrome DevTools workspace configuration
      operationId: getDevToolsConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      root:
                        type: string
                      uuid:
                        type: string
        '403':
          description: Not running in dev mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check
      operationId: checkHealth
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /api/status:
    get:
      summary: Get system status
      operationId: getStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/dev/restart:
    post:
      summary: Trigger a server rebuild and restart (dev mode only)
      operationId: devRestart
      responses:
        '200':
          description: Restart initiated
        '403':
          description: Not running in dev mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects:
    get:
      summary: List all known projects
      operationId: listProjects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInfo'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add a new project by folder path
      operationId: addProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}:
    delete:
      summary: Remove a project from Hydra (does not delete files on disk)
      operationId: removeProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/config-toml:
    get:
      summary: Get the raw .hydra/config.toml content for the trust prompt
      operationId: getProjectConfigToml
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigTomlResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/trust:
    post:
      summary: Mark the project's current .hydra/config.toml as trusted
      operationId: trustProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents:
    get:
      summary: List all Hydra agents (heads)
      operationId: listAgents
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID to scope the agent list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Spawn a new Hydra agent
      operationId: spawnAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID to spawn the agent in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpawnAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Project is not trusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/restart:
    post:
      summary: Restart a Hydra agent (kill and respawn with the same prompt)
      operationId: restartAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (Agent restarted, new agent returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/merge:
    post:
      summary: Merge a Hydra agent's branch into its base branch and kill it
      operationId: mergeAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Agent merged and killed)
        '400':
          description: Bad Request (e.g. no branch to merge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress or merge conflicts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/update-from-base:
    post:
      summary: Update a Hydra agent's branch from its base branch (merge base into head)
      operationId: updateAgentFromBase
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Updated from base)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (merge conflicts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/commits:
    get:
      summary: List commits on an agent's branch (between base branch and agent branch)
      operationId: getAgentCommits
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommitInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/diff:
    get:
      summary: Get the diff for an agent's branch
      operationId: getAgentDiff
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Base commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Head commit SHA or ref. Defaults to the agent's branch.
        - in: query
          name: ignore_whitespace
          required: false
          schema:
            type: boolean
          description: Ignore whitespace changes in the diff
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Include uncommitted changes in the worktree in the diff
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: Only return the diff for this specific file path
        - in: query
          name: context
          required: false
          schema:
            type: integer
            default: 3
          description: Number of lines of context to show (defaults to 3)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/diff-files:
    get:
      summary: Get the list of changed files for an agent's branch
      operationId: getAgentDiffFiles
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Base commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Head commit SHA or ref. Defaults to the agent's branch.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Include uncommitted changes in the worktree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/artifacts:
    get:
      summary: Get generated visual artifacts (e.g. screenshots) for both sides of a diff
      description: >
        Returns, per configured artifact script, the generated image files for
        the left and right versions of the comparison and whether they differ.
        Generation runs in the background and is cached; a script with status
        "generating" should be polled. Returns an empty list when the project
        configures no artifact scripts.
      operationId: getAgentArtifacts
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Left (base) commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Right (head) commit SHA or ref. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Use the agent's uncommitted working tree as the right version.
        - in: query
          name: refresh
          required: false
          schema:
            type: string
          description: >
            Name of a single artifact script whose cached result (including a
            cached failure) should be discarded and regenerated for both sides
            of the comparison before responding.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/input:
    post:
      summary: Send text input to an agent's terminal stdin
      operationId: sendAgentInput
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInputRequest'
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/config:
    get:
      summary: Get the merged configuration
      operationId: getConfig
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [project, user]
          description: Load only a specific scope's raw config instead of the merged config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Save configuration changes
      operationId: saveConfig
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [project, user]
          description: Whether to save to the project or user config file (defaults to project)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigResponse'
      responses:
        '200':
          description: OK
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/tree:
    get:
      summary: List the files tracked in the project's repository
      operationId: getRepositoryTree
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref to read the tree from (defaults to HEAD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryTreeResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/file:
    get:
      summary: Read the contents of a file in the project's repository
      operationId: getRepositoryFile
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: path
          required: true
          schema:
            type: string
          description: Repo-relative path of the file to read
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref to read the file from (defaults to HEAD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryFileResponse'
        '404':
          description: Project or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/branches:
    get:
      summary: List the branches available for the project's repository
      operationId: getRepositoryBranches
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBranchesResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}:
    get:
      summary: Get a specific Hydra agent by ID
      operationId: getAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Kill a Hydra agent by ID
      operationId: killAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Agent killed)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required: [error, code, details]
      properties:
        error:
          type: string
          description: "Machine-readable error type (e.g. internal_error, not_found, unauthorized, docker_connect)"
          enum: [not_found, unauthorized, internal_error, docker_connect, path_not_found, not_a_git_repo, bad_request, conflict, untrusted_project]
        code:
          type: integer
          description: "HTTP status code"
        details:
          type: string
          description: "Human-readable error description"

    MergeConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              enum: [merge_conflict, conflict]

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "OK"
        sandbox_error:
          type: string
          nullable: true
          description: "Error message if the sandbox backend is unavailable or misconfigured"
        version:
          type: string
          example: "1.0.0"
        uptime_seconds:
          type: number
          format: float
          description: Seconds since the server started
        project_root:
          type: string
          description: Absolute path to the default project root (server CWD)
        default_project_id:
          type: string
          description: Project ID of the default (CWD) project
        development:
          type: boolean
          description: Whether the server is running in development mode

    ProjectInfo:
      type: object
      required: [id, path, name, trusted]
      properties:
        id:
          type: string
          description: Unique project identifier (derived from folder name)
        path:
          type: string
          description: Absolute filesystem path to the project root
        name:
          type: string
          description: Human-readable project name (last path component)
        trusted:
          type: boolean
          description: >-
            Whether the project's .hydra/config.toml is currently trusted by the
            user. True when there is no project config (nothing repo-controlled
            to execute) or when the current config's content matches what the
            user accepted. False means the user must review and trust the config
            before agents can be spawned or host artifact commands can run.

    ConfigTomlResponse:
      type: object
      required: [content, exists, trusted]
      properties:
        content:
          type: string
          description: Raw text of the project's .hydra/config.toml (empty when absent)
        exists:
          type: boolean
          description: Whether a .hydra/config.toml file is present in the project
        trusted:
          type: boolean
          description: Whether this exact config content is currently trusted

    AddProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute filesystem path to the project root (must be a git repository)
        create_if_missing:
          type: boolean
          description: Whether to create the directory if it doesn't exist.
        init_git:
          type: boolean
          description: Whether to initialize a git repository if it's not already one.

    SpawnAgentRequest:
      type: object
      required: [id]
      properties:
        prompt:
          type: string
          description: The prompt to give to the agent
        id:
          type: string
          description: Unique identifier for the agent (slug format, max 40 chars)
        agent_type:
          type: string
          description: "Agent type: claude, gemini, or bash"
        base_branch:
          type: string
          description: Base branch to create the worktree from (defaults to current branch)
        ephemeral:
          type: boolean
          description: If true, the agent is a throwaway test agent whose worktree and branch are torn down when it stops.

    AgentStatus:
      type: string
      enum:
        - pending
        - building
        - starting
        - running
        - waiting
        - finished
        - stopped
        - killing
        - merging
      description: "The computed status of the agent (derived from container, agent, and head status)"

    AgentStatusInfo:
      type: object
      required: [status, timestamp]
      properties:
        status:
          $ref: '#/components/schemas/AgentStatus'
        event:
          type: string
          description: "The hook event that triggered this status (SessionStart, Stop, SessionEnd, or polling)"
        timestamp:
          type: string
          description: "ISO 8601 timestamp of when the status was set"
        last_message:
          type: string
          description: "Last assistant message (present on turn-end and notification events)"
        reason:
          type: string
          description: "Session end reason (only present on SessionEnd events)"
        activity:
          type: string
          description: "Short human-readable description of the agent's current action, derived from status_log.jsonl (present while running)"

    AgentResponse:
      type: object
      required: [id, project_path, session_pid, session_status, agent_type, pre_prompt, prompt, base_branch]
      properties:
        id:
          type: string
        branch_name:
          type: string
          nullable: true
        worktree_path:
          type: string
          nullable: true
        project_path:
          type: string
        session_pid:
          type: integer
          description: PID of the running sandbox session, or 0 if not running
        session_status:
          type: string
          description: Sandbox session status (pending|starting|running|stopped)
        agent_type:
          type: string
        pre_prompt:
          type: string
        prompt:
          type: string
        base_branch:
          type: string
        ephemeral:
          type: boolean
          description: If true, the agent is a throwaway test agent whose worktree and branch are torn down when it stops.
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the session was started; 0 if not started
        agent_status:
          $ref: '#/components/schemas/AgentStatusInfo'

    CommitInfo:
      type: object
      required: [sha, short_sha, message, author_name, author_email, timestamp]
      properties:
        sha:
          type: string
          description: Full 40-character commit SHA
        short_sha:
          type: string
          description: Abbreviated 7-character commit SHA
        message:
          type: string
          description: Full commit message
        subject:
          type: string
          description: First line of the commit message
        author_name:
          type: string
        author_email:
          type: string
        timestamp:
          type: string
          description: ISO 8601 timestamp of the author date

    RepositoryTreeResponse:
      type: object
      required: [ref, files]
      properties:
        ref:
          type: string
          description: The git ref the tree was read from (e.g. HEAD)
        default_path:
          type: string
          nullable: true
          description: Suggested file to open first (README.md when present), or null
        files:
          type: array
          items:
            type: string
          description: Repo-relative paths of every file tracked at this ref

    RepositoryFileResponse:
      type: object
      required: [path, ref, size, binary, truncated, symlink]
      properties:
        path:
          type: string
          description: Repo-relative path of the file
        ref:
          type: string
          description: The git ref the file was read from
        size:
          type: integer
          description: File size in bytes
        binary:
          type: boolean
          description: True when the file looks binary; content is then omitted
        truncated:
          type: boolean
          description: True when content was truncated because the file is large
        content:
          type: string
          nullable: true
          description: UTF-8 file content (omitted for binary files)
        symlink:
          type: boolean
          description: True when the requested path is a symbolic link; the other fields then describe the link's target
        symlink_target:
          type: string
          nullable: true
          description: The link's target exactly as stored (relative or absolute), set when symlink is true
        target_path:
          type: string
          nullable: true
          description: Repo-relative path of the file the symlink ultimately resolves to (whose content is returned); null when the link is broken, escapes the repo, or points at a directory

    RepositoryBranch:
      type: object
      required: [name, is_agent, is_current]
      properties:
        name:
          type: string
          description: Branch name (e.g. main, hydra/my-task)
        is_agent:
          type: boolean
          description: True for Hydra agent branches (hydra/*), which are listed first
        is_current:
          type: boolean
          description: True for the repository's currently checked-out branch (HEAD)

    RepositoryBranchesResponse:
      type: object
      required: [current, branches]
      properties:
        current:
          type: string
          description: The repository's currently checked-out branch (HEAD), or "" when detached
        branches:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryBranch'
          description: Branches ordered with Hydra agent branches first, then the rest

    DiffLine:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [context, addition, deletion, no_newline]
          description: "context: unchanged line; addition: added line; deletion: removed line; no_newline: no newline at end of file"
        content:
          type: string
          description: Line content without the diff prefix character
        old_line_num:
          type: integer
          nullable: true
          description: Line number in the old file (null for additions)
        new_line_num:
          type: integer
          nullable: true
          description: Line number in the new file (null for deletions)

    DiffHunk:
      type: object
      required: [header, old_start, new_start, lines]
      properties:
        header:
          type: string
          description: The @@ ... @@ hunk header line
        old_start:
          type: integer
          description: Starting line number in the old file
        new_start:
          type: integer
          description: Starting line number in the new file
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffLine'

    DiffFile:
      type: object
      required: [path, change_type, additions, deletions, binary, hunks]
      properties:
        path:
          type: string
          description: File path (new path for renamed files)
        old_path:
          type: string
          nullable: true
          description: Original file path (only set for renamed files)
        change_type:
          type: string
          enum: [added, modified, deleted, renamed]
        additions:
          type: integer
          description: Number of added lines
        deletions:
          type: integer
          description: Number of deleted lines
        binary:
          type: boolean
          description: True if this is a binary file
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunk'

    DiffResponse:
      type: object
      required: [files, base_ref, head_ref]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/DiffFile'
        base_ref:
          type: string
          description: The base ref used for this diff
        head_ref:
          type: string
          description: The head ref used for this diff
        merge_conflict:
          type: boolean
          description: True if there are merge conflicts between base_ref and head_ref
        conflict_files:
          type: array
          description: List of files with merge conflicts (populated when merge_conflict is true)
          items:
            type: string
        uncommitted_changes:
          type: boolean
          description: True if there are uncommitted changes in the worktree
        uncommitted_summary:
          description: Counts of uncommitted changes in the worktree
          $ref: '#/components/schemas/UncommittedSummary'
        behind_count:
          type: integer
          description: Number of commits on the base branch not yet merged into the agent branch (how far behind the base the branch is)
        base_commit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommitInfo'
          description: Details of the base commit (if a specific commit SHA was given)
        head_commit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommitInfo'
          description: Details of the head commit

    UncommittedSummary:
      type: object
      required: [tracked_count, untracked_count]
      properties:
        tracked_count:
          type: integer
          description: Number of tracked files with staged or unstaged changes
        untracked_count:
          type: integer
          description: Number of untracked (new, never-added) files

    AgentInputRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Text to send to the agent's stdin (a newline is appended automatically)

    NetworkConfig:
      type: object
      properties:
        enabled:
          type: boolean
          nullable: true
          description: Whether outbound network access is allowed (default true)
        allowed_hosts:
          type: array
          items:
            type: string
          nullable: true
          description: Reserved for a future proxy-based host allow-list (not yet enforced)

    SandboxConfig:
      type: object
      description: User-editable sandbox policy, additive on top of baked-in defaults
      properties:
        writable_paths:
          type: array
          items:
            type: string
          nullable: true
        masked_paths:
          type: array
          items:
            type: string
          nullable: true
        restore_ro:
          type: array
          items:
            type: string
          nullable: true
        pre_spawn_script:
          type: string
          nullable: true
          description: Bash script run inside the sandbox once, when the agent is first spawned — not on resume or for bash shells (e.g. `mise trust`)
        network:
          $ref: '#/components/schemas/NetworkConfig'
          nullable: true

    AgentConfig:
      type: object
      properties:
        sandbox:
          $ref: '#/components/schemas/SandboxConfig'
          nullable: true
        pre_prompt:
          type: string
          nullable: true

    ArtifactScript:
      type: object
      required: [name, command]
      description: A per-project command that renders visual artifacts (e.g. screenshots) of a checkout, shown side-by-side in the diff viewer
      properties:
        name:
          type: string
          description: Unique label, also used as the cache directory
        command:
          type: string
          description: Shell command run via `sh -c` in the checkout directory
        timeout_sec:
          type: integer
          description: Max seconds the command may run (0 = built-in default)
        unsafe_host:
          type: boolean
          description: Run on the host with NO sandbox — full access to the machine and credentials (default false)

    ConfigResponse:
      type: object
      required: [defaults, agents]
      properties:
        defaults:
          $ref: '#/components/schemas/AgentConfig'
        agents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentConfig'
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactScript'
          nullable: true
          description: Per-project visual-artifact generation scripts ([[artifacts]] in config.toml)
        default_pre_prompt:
          type: string
          description: Built-in default pre-prompt always prepended to agent prompts (read-only)

    ArtifactFile:
      type: object
      required: [name, change_type]
      properties:
        name:
          type: string
          description: File name relative to the artifact set
        change_type:
          type: string
          enum: [added, removed, modified, unchanged]
        left_url:
          type: string
          nullable: true
          description: URL of the file for the left version (null if absent on the left)
        right_url:
          type: string
          nullable: true
          description: URL of the file for the right version (null if absent on the right)

    ArtifactSet:
      type: object
      required: [name, status, changed, files]
      properties:
        name:
          type: string
          description: The configured artifact script name
        status:
          type: string
          enum: [ready, generating, error]
        changed:
          type: boolean
          description: Whether any file differs between the two versions
        error:
          type: string
          nullable: true
        started_at:
          type: integer
          format: int64
          nullable: true
          description: >-
            Unix time (seconds) the earliest in-flight side started, so the UI
            can show how long it has been running. Only set while status is
            "generating".
        left_progress:
          type: string
          nullable: true
          description: >-
            Latest progress line of the in-flight LEFT (before) generation. Taken
            from `::hydra:progress::` marker lines the script emits, falling back
            to the latest stdout line until the first marker is seen. Only set
            while that side is generating.
        right_progress:
          type: string
          nullable: true
          description: As left_progress, for the RIGHT (after) generation.
        left_log:
          type: array
          nullable: true
          description: >-
            Captured stdout+stderr lines of the in-flight LEFT (before)
            generation, surfaced as a live log. Only populated while that side is
            generating; once settled, fetch left_log_url instead.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        right_log:
          type: array
          nullable: true
          description: As left_log, for the RIGHT (after) generation.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        left_log_url:
          type: string
          nullable: true
          description: >-
            URL to fetch the persisted build log of the LEFT (before) side once
            it has settled (ready or error), so the log can be reopened after
            generation finishes. Null while generating or if no log was captured.
        right_log_url:
          type: string
          nullable: true
          description: As left_log_url, for the RIGHT (after) side.
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFile'

    ArtifactLogLine:
      type: object
      required: [text, stream]
      properties:
        text:
          type: string
          description: One captured output line (no trailing newline)
        stream:
          type: string
          enum: [stdout, stderr]
          description: Which stream the line came from; stderr is rendered in red

    ArtifactsResponse:
      type: object
      required: [scripts]
      properties:
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSet'

    TerminalEvent:
      type: object
      required: [type]
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/TerminalStatusEvent'
          data: '#/components/schemas/TerminalDataEvent'
          diff_refresh: '#/components/schemas/TerminalEvent'
      properties:
        type:
          type: string
          enum: [status, data, diff_refresh]

    TerminalStatusEvent:
      allOf:
        - $ref: '#/components/schemas/TerminalEvent'
        - type: object
          properties:
            status:
              $ref: '#/components/schemas/AgentStatus'

    TerminalDataEvent:
      allOf:
        - $ref: '#/components/schemas/TerminalEvent'
        - type: object
          properties:
            data:
              type: string
              description: Base64 encoded binary data or plain string

