    # --- Normalized event payloads --------------------------------------------
    #
    # A ChatEvent's `payload` varies by its `type`. OpenAPI discriminators only
    # work on a property within the same schema, so `payload` cannot declare a
    # oneOf keyed on its sibling `type` - modelling that as one union would mean
    # repeating the envelope 30 times and turning ChatEvent into an opaque
    # generated union wrapper, which the daemon's event store cannot field-access.
    #
    # Instead each payload is a named schema here, the daemon constructs those
    # types directly, and the browser composes them into a discriminated union in
    # web/src/lib/chatEvents.ts (thirty lines of `type` aliases over these).
    #
    # What stays open is only what the PROVIDER owns: `entry` (its whole recorded
    # entry, which the Raw panel shows), a tool's `input`/`content`, an
    # `interaction`, `usage` accounting, and an `error`. Those differ per agent
    # type and per tool, and pinning them down would mean tracking two CLIs'
    # release trains in this file.

    ChatProviderEntry:
      type: object
      additionalProperties: true
      description: >-
        The provider's own recorded entry for this event, with the message
        content taken out (the payload already carries it, and a tool result can
        be a megabyte). The chat's Raw panel shows this rather than a handful of
        fields something thought to copy across, so it is deliberately open.

    ChatProviderContext:
      type: object
      description: >-
        What a provider-derived display event carries besides its own fields: who
        produced it and where it belongs. Sidechain events are a sub-agent's own
        steps, folded into that sub-agent's card rather than the main flow.

        Deliberately a separate schema rather than allOf'd into each payload: Go
        embeds it alongside the payload (encoding/json promotes embedded fields,
        so the wire stays flat) and TypeScript intersects the two. Flattening it
        into every payload would mean copying eight fields at every construction
        site in the daemon.
      properties:
        uuid:
          type: string
          x-go-type-skip-optional-pointer: true
          description: The provider's id for the record this came from.
        sidechain:
          type: boolean
          x-go-type-skip-optional-pointer: true
        agent_id:
          type: string
          x-go-type-skip-optional-pointer: true
          description: The sub-agent whose step this is.
        parent_item_id:
          type: string
          x-go-type-skip-optional-pointer: true
          description: The tool call this belongs under.
        stop_reason:
          type: string
          x-go-type-skip-optional-pointer: true
        cwd:
          type: string
          x-go-type-skip-optional-pointer: true
          description: Where the provider says its shell was left.
        usage:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          description: Provider token accounting; the shape differs per provider.
        entry:
          $ref: '#/components/schemas/ChatProviderEntry'

