openapi: 3.0.3
info:
  title: Hydra API
  version: 1.0.0

paths:
  /.well-known/appspecific/com.chrome.devtools.json:
    get:
      summary: Chrome DevTools workspace configuration
      operationId: getDevToolsConfig
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  workspace:
                    type: object
                    properties:
                      root:
                        type: string
                      uuid:
                        type: string
        '403':
          description: Not running in dev mode
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      summary: Health check
      operationId: checkHealth
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: "OK"

  /api/status:
    get:
      summary: Get system status
      operationId: getStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/usage/claude:
    get:
      summary: Get cached Claude Code subscription usage
      description: >
        Probes the locally-installed Claude CLI (`claude /usage`) for the
        account's subscription quota and returns a cached snapshot. Probing
        starts a Claude CLI under a PTY for a few seconds, so it is rationed:
        a snapshot is served for ~10 minutes before a request is allowed to
        re-probe, a request arriving while a probe is in flight is served the
        cached snapshot rather than queued, and repeated failures back off and
        then park the probe (retried every few hours rather than every few
        minutes). Pass refresh=true to force a fresh probe, which skips the
        cache and the backoff; forced probes are still floored at one per 30s.
      operationId: getClaudeUsage
      parameters:
        - name: refresh
          in: query
          required: false
          description: Bypass the cache and re-probe the CLI.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeUsageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/server/restart:
    post:
      summary: Restart the server in place, running the binary already installed
      description: >
        Re-execs the current executable, keeping the process ID and carrying the
        web listener across so the port is never unbound. Running agents are
        stopped and resume afterwards. Does not rebuild anything - see
        /api/server/update for that.
      operationId: restartServer
      responses:
        '202':
          description: Restart initiated; the connection will drop shortly
        '403':
          description: This server cannot restart itself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/server/update:
    post:
      summary: Rebuild the server from source, then restart into the result
      description: >
        Builds in the background while this server keeps serving, verifies the
        new binary starts, swaps it in atomically, and only then restarts. A
        failed build changes nothing. Progress streams over
        /ws/server/update. Only available when the daemon's project root is a
        Hydra checkout.
      operationId: updateServer
      responses:
        '202':
          description: Update started; follow /ws/server/update for progress
        '403':
          description: This server cannot rebuild itself
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An update is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects:
    get:
      summary: List all known projects
      operationId: listProjects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectInfo'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add a new project by folder path
      operationId: addProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/order:
    put:
      summary: Reorder the project list (the order the project selector shows)
      operationId: reorderProjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderProjectsRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}:
    delete:
      summary: Remove a project from Hydra (does not delete files on disk)
      operationId: removeProject
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/icon:
    put:
      summary: Set (or clear) a project's custom icon
      operationId: setProjectIcon
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectIconRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectInfo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/hidden:
    put:
      summary: Hide a project from the project lists (or show it again)
      operationId: setProjectHidden
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectHiddenRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/track-remote:
    post:
      summary: Ensure the local "hydra-agents" git remote exists so the user can check out and follow head branches
      operationId: ensureTrackRemote
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackRemoteResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/config-toml:
    get:
      summary: Get the raw .hydra/config.toml content for the trust prompt the UI shows on first open
      operationId: getProjectConfigToml
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigTomlResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/config-toml-preview:
    get:
      summary: Preview the .hydra/config.toml at a filesystem path for the add-project trust prompt (read-only, does not register the project)
      operationId: previewConfigToml
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigTomlResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/resolve-path:
    get:
      summary: Resolve a hand-typed folder path to an absolute one (expands "~" and resolves relative paths against home) and report what is there
      operationId: resolvePath
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPathResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents:
    get:
      summary: List all Hydra agents (heads)
      operationId: listAgents
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID to scope the agent list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Spawn a new Hydra agent
      operationId: spawnAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID to spawn the agent in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpawnAgentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (a head with this ID already exists - active, archived, or in another project)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/archived:
    get:
      summary: List archived (killed/merged) Hydra agents, newest first
      description: Returns a page of finished agents retained for the browsable history list. Supports limit/offset for infinite scroll.
      operationId: listArchivedAgents
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID to scope the archived agent list
        - in: query
          name: limit
          required: false
          schema:
            type: integer
          description: Maximum number of archived agents to return (page size). Omit or <=0 for all.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
          description: Number of archived agents to skip (for pagination).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/restart:
    post:
      summary: Restart a Hydra agent (kill and respawn with the same prompt)
      operationId: restartAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (Agent restarted, new agent returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/restart-session:
    post:
      summary: Restart just the agent process (keeps the worktree, branch and conversation)
      description: >-
        Stops the running CLI process (claude/codex/...) and relaunches it in a
        fresh sandbox, resuming the same conversation. Unlike restartAgent this
        does no teardown: the worktree, branch, DB record and transcript are
        untouched.
      operationId: restartAgentSession
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (agent process restarted)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (agent is archived, or an operation is in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/resume:
    post:
      summary: Resume an archived (killed/merged) agent, restoring its conversation
      description: >-
        Revives a killed or merged agent: recreates its worktree and branch off
        the current base, un-archives the record, and relaunches the agent so it
        continues from its saved conversation transcript (the file changes start
        fresh on a clean branch). Depends on the host conversation transcript
        still existing.
      operationId: resumeAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK (Agent resumed, revived live agent returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Not Found (no archived agent with that ID)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/merge:
    post:
      summary: Merge a Hydra agent's branch into its base branch and, unless close=false, kill it
      operationId: mergeAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: force
          required: false
          schema:
            type: boolean
          description: >-
            Bypass the test gate (PLAN #68). Without it, a merge is soft-blocked
            with 409 tests_failing / tests_errored when the head's configured
            tests are failing, errored, or still running. force=true merges
            anyway - covering both "don't wait" (tests still running) and
            "override" (tests red). Merge-conflict and operation-in-progress
            checks still apply.
        - in: query
          name: close
          required: false
          schema:
            type: boolean
            default: true
          description: >-
            Whether to tear the agent down after the merge. Default (true)
            merges the branch and closes the head - session killed, worktree
            and branch removed, archived as "merged". close=false merges the
            branch but keeps the agent running: session, worktree, branch and
            uncommitted work all survive, and the agent's diff resets to only
            the work not yet merged. The test gate and conflict checks apply
            the same either way.
      responses:
        '204':
          description: No Content (branch merged; agent killed unless close=false)
        '400':
          description: Bad Request (e.g. no branch to merge)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress or merge conflicts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/publish:
    post:
      summary: Publish a Hydra agent's branch as a forge MR/PR (create or update the link)
      operationId: publishAgent
      description: >-
        Host-side, by the daemon, with the user's own credentials
        (docs/non-local-integration.md). Claims the head (publishing), runs the
        local test gate (like merge; force bypasses), pushes hydra/<id> to the
        downstream branch on the remote, then creates the MR/PR if none exists.
        The local branch is untouched. Idempotent: re-publishing pushes again and
        the MR follows. Returns the updated agent with its review link.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: force
          required: false
          schema: { type: boolean }
          description: Bypass the local test gate (same semantics as merge's force).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Overrides for the Create MR dialog. Absent fields fall back to the resolved [review] config + head defaults.
              properties:
                downstream_branch:
                  type: string
                  description: Branch name to push AS. Defaults to the head's downstream_branch (seeded from review.push_branch_template).
                remote:
                  type: string
                  description: Git remote to push to. Defaults to review.remote.
                target_branch:
                  type: string
                  description: MR target branch. Defaults to the head's base branch.
                title:
                  type: string
                description:
                  type: string
                draft:
                  type: boolean
      responses:
        '200':
          description: Published (returns the updated agent with its review link).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request (no branch, provider not configured, push auth failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation in progress, tests failing, or push rejected)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/publish-push:
    post:
      summary: Push the local head branch to its linked MR's downstream branch (Push to MR)
      operationId: pushToMr
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pushed (returns the updated agent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request (not linked, no branch, or push auth failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/publish-pull:
    post:
      summary: Pull the remote downstream branch into the local head branch (Pull from MR)
      operationId: pullFromMr
      description: Fetches, then merges the remote-tracking downstream ref INTO the head branch (merge-not-rebase, same as update-from-base). Conflicts surface as 409.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Pulled (returns the updated agent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request (not linked or no branch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (merge conflict pulling the remote in)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/downstream-branch:
    patch:
      summary: Set a head's downstream branch name (the name it is pushed AS)
      operationId: setDownstreamBranch
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [downstream_branch]
              properties:
                downstream_branch:
                  type: string
      responses:
        '200':
          description: Updated (returns the updated agent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request (invalid branch name, or soft-locked after publish without confirm)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/review/threads:
    get:
      summary: The review threads on this head's MR, for the diff viewer
      operationId: getReviewThreads
      description: >
        Returns the forge's review conversations for this head's linked MR, anchored to
        file/line, with Hydra's local-only notes merged in (docs/review-threads.md).
        Fetched live from the forge host-side; if that call fails the last cached
        threads are returned with stale=true and an error hint, so the diff still
        renders. An unlinked head returns an empty list.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The head's review threads (empty when unlinked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewThreadsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Start a new review thread on a line of this head's MR
      operationId: createReviewComment
      description: >
        Posts a new review comment on the MR's diff, as the user, host-side via gh/glab.
        The line is a NEW-side line number. Fails cleanly when the head has no MR, when
        the line is not part of the MR's diff, or when the forge CLI is unauthenticated.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReviewCommentRequest'
      responses:
        '200':
          description: Posted (returns the refreshed threads).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewThreadsResponse'
        '400':
          description: Bad Request (unlinked head, empty body, or the forge rejected it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/review/threads/{thread_id}/reply:
    post:
      summary: Reply to a review thread on this head's MR
      operationId: replyToReviewThread
      description: >
        Adds a reply to an existing thread. `local: true` keeps the reply inside Hydra
        (visible in the diff viewer, never sent to the forge); otherwise it is posted to
        the forge as the user. Agents only ever write local notes, and they do so through
        their MCP tool rather than this endpoint.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: thread_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReplyRequest'
      responses:
        '200':
          description: Replied (returns the refreshed threads).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewThreadsResponse'
        '400':
          description: Bad Request (unlinked head, empty body, or the forge rejected it)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/reviews:
    get:
      summary: List existing PRs/MRs on the project's forge, for the adoption picker
      operationId: listReviews
      description: Enumerates open PRs/MRs (via gh/glab) so a head can be spawned onto one (docs/pr-adoption.md). Host-side, using the user's forge CLI auth. Never fails hard - an unconfigured/unauthenticated forge returns configured/authenticated flags and an error hint with an empty list.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
          description: '"open" (default) | "all" | "merged" | "closed".'
        - in: query
          name: author
          required: false
          schema: { type: string }
          description: '"@me" to list only the authenticated user''s own PRs.'
        - in: query
          name: search
          required: false
          schema: { type: string }
          description: Free-text search (forge-native syntax).
        - in: query
          name: limit
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReviewsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/review-config:
    get:
      summary: Resolved [review] config + live forge auth status for a project
      operationId: getReviewConfig
      description: The effective, resolved review settings (provider auto-detected from the remote URL) plus the forge CLI's live auth status, for the Settings Review section and the Create MR dialog prefill.
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewConfigResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/update-from-base:
    post:
      summary: Update a Hydra agent's branch from its base branch (merge base into head)
      operationId: updateAgentFromBase
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Updated from base)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (merge conflicts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/commits:
    get:
      summary: List commits on an agent's branch (between base branch and agent branch)
      operationId: getAgentCommits
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommitInfo'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/diff:
    get:
      summary: Get the diff for an agent's branch
      operationId: getAgentDiff
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Base commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Head commit SHA or ref. Defaults to the agent's branch.
        - in: query
          name: ignore_whitespace
          required: false
          schema:
            type: boolean
          description: Ignore whitespace changes in the diff
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Include uncommitted changes in the worktree in the diff
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: Only return the diff for this specific file path
        - in: query
          name: context
          required: false
          schema:
            type: integer
            default: 3
          description: Number of lines of context to show (defaults to 3)
        - in: query
          name: full_context
          required: false
          schema:
            type: boolean
          description: >-
            Return each file's full content (so the client can expand context
            without further round-trips), in a single request for all files.
            Files larger than max_full_lines are returned at the normal context
            instead. Combined with path it expands just that file, which is how
            the client promotes a single big file (left windowed by the bulk
            caps) once the reader expands it - pass caps above the bulk ones.
        - in: query
          name: max_full_changes
          required: false
          schema:
            type: integer
            default: 1000
          description: >-
            Only auto-expand files with at most this many changed lines. Larger
            files (which the client also hides by default) keep the normal
            context so their full content isn't shipped until requested. Only
            meaningful with full_context.
        - in: query
          name: max_full_lines
          required: false
          schema:
            type: integer
            default: 6000
          description: >-
            Upper bound on the full content shipped per expanded file. A file
            whose whole content exceeds this stays at the normal context. Only
            meaningful with full_context.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/diff-files:
    get:
      summary: Get the list of changed files for an agent's branch
      operationId: getAgentDiffFiles
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Base commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Head commit SHA or ref. Defaults to the agent's branch.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Include uncommitted changes in the worktree
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/artifacts:
    get:
      summary: Get generated visual artifacts (e.g. screenshots) for both sides of a diff
      description: >
        Returns, per configured artifact script, the generated image files for
        the left and right versions of the comparison and whether they differ.
        Generation runs in the background and is cached; a script with status
        "generating" should be polled. Returns an empty list when the project
        configures no artifact scripts.
      operationId: getAgentArtifacts
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: base_ref
          required: false
          schema:
            type: string
          description: Left (base) commit SHA or ref. Defaults to the agent's base branch.
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Right (head) commit SHA or ref. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Use the agent's uncommitted working tree as the right version.
        - in: query
          name: refresh
          required: false
          schema:
            type: string
          description: >
            Name of a single artifact script whose cached result (including a
            cached failure) should be discarded and regenerated before
            responding. By default both sides of the comparison are regenerated;
            pass refresh_side to regenerate just one.
        - in: query
          name: refresh_side
          required: false
          schema:
            type: string
            enum: [left, right]
          description: >
            Limits a refresh to a single side - "left" (before) or "right"
            (after). Ignored unless refresh names a script; when omitted both
            sides are regenerated.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/previews:
    get:
      summary: List live server previews ([previews.<name>]) for a head
      description: >
        Returns, per configured [previews.<name>] script, the preview
        instance status for the requested version (the head's uncommitted
        working tree or a specific commit - the same selection contract as the
        artifacts and tests endpoints), plus any still-running instances of
        those scripts at other versions. Purely a read: nothing is spawned.
        Returns an empty list when the project configures no server scripts.
      operationId: getAgentPreviews
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Commit SHA or ref to preview. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Preview the agent's uncommitted working tree (its live worktree).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/previews/{name}/start:
    post:
      summary: Start (or ensure) a live server preview instance
      description: >
        Ensures the named preview script has a proxy listener for
        the requested version and spawns its server if not already running.
        Returns the instance status including the URL to open; the server may
        still be "starting" (building) - opening the URL shows a live loading
        page until it is ready.
      operationId: startAgentPreview
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The preview script name
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Commit SHA or ref to preview. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Preview the agent's uncommitted working tree (its live worktree).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewStatus'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/previews/{name}/stop:
    post:
      summary: Stop a live server preview instance
      description: >
        Tears down the named preview's server process for the requested version
        (the listener persists, so a later start or visit respawns it). A no-op
        if nothing is running.
      operationId: stopAgentPreview
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The preview script name
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Commit SHA or ref whose instance to stop. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Stop the instance for the agent's uncommitted working tree.
      responses:
        '204':
          description: Stopped (or nothing was running)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/tests:
    get:
      summary: Get the test-runner verdict(s) for a head's branch
      description: >
        Returns, per configured [tests.<name>] runner, the parsed pass/fail verdict
        for the head's current commit (or working tree). Generation runs in the
        background and is cached per commit SHA; a runner with status "running"
        should be polled. Returns an empty list when the project configures no
        test runners. Single-sided - there is no before/after comparison (PLAN
        #68).
      operationId: getAgentTests
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: head_ref
          required: false
          schema:
            type: string
          description: Commit SHA or ref to test. Defaults to the agent's branch tip.
        - in: query
          name: include_uncommitted
          required: false
          schema:
            type: boolean
          description: Test the agent's uncommitted working tree instead of a commit.
        - in: query
          name: refresh
          required: false
          schema:
            type: string
          description: >-
            Name of a single test runner whose cached result (including a cached
            failure) should be discarded and re-run before responding.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestsResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/merge-when-green:
    post:
      summary: Arm auto-merge - merge this head when its tests settle passing
      description: >
        Arms "merge when green" (PLAN #68): the daemon merges this head as soon
        as its tests settle passing, and disarms it (with a notification) if they
        settle failing/errored. Arming kicks a fresh test run if none is in
        flight. Idempotent.
      operationId: armMergeWhenGreen
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (auto-merge armed)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Disarm auto-merge for a head
      operationId: disarmMergeWhenGreen
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (auto-merge disarmed)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/publish-when-green:
    post:
      summary: Arm publish-when-green - auto-open a draft MR / auto-push when tests settle passing
      description: >
        Arms "publish when green" (docs/non-local-integration.md): once local tests
        settle passing and the agent has finished, an unlinked head auto-opens a
        draft MR and a linked head auto-pushes (plain push only). Idempotent.
        Arming an ADOPTED PR - one Hydra did not create - additionally requires
        acknowledge_adopted=true, since it starts pushing into someone else's PR
        (docs/pr-adoption.md); without it such a head is refused with a 400.
      operationId: armPublishWhenGreen
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: acknowledge_adopted
          required: false
          description: >
            Acknowledges that this head is working on a PR Hydra did not create, so
            arming means auto-pushing into someone else's PR on every green commit.
            Required (true) to arm an adopted head; ignored for any other head. A
            read-only adopted PR (no maintainer edits) is refused even with it, since
            no push can succeed.
          schema: { type: boolean }
      responses:
        '204':
          description: No Content (publish-when-green armed)
        '400':
          description: Bad Request (e.g. an adopted PR without acknowledge_adopted, or a read-only one)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Disarm publish-when-green for a head
      operationId: disarmPublishWhenGreen
      parameters:
        - in: path
          name: project_id
          required: true
          schema: { type: string }
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No Content (publish-when-green disarmed)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/input:
    post:
      summary: Send text input to an agent's terminal stdin
      operationId: sendAgentInput
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInputRequest'
      responses:
        '200':
          description: OK
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/approvals:
    get:
      summary: List the agent's pending security-gate approval requests
      operationId: listAgentApprovals
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/approvals/{reqid}:
    post:
      summary: Resolve a pending security-gate approval (allow/deny, optionally remember)
      operationId: decideAgentApproval
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: reqid
          required: true
          schema:
            type: string
          description: The approval request ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecisionRequest'
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/read:
    post:
      summary: Mark an agent as read, clearing its unread-changes flag
      operationId: markAgentRead
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/unread:
    post:
      summary: Mark an agent as unread, raising its unread-changes flag
      operationId: markAgentUnread
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/generate-title:
    post:
      summary: Generate a title for an agent from its task prompt
      description: >-
        Asks a cheap one-shot LLM call to summarise the agent's original task
        prompt into a short title - the same call the spawn flow makes in the
        background. This only RETURNS the title; it does not persist it, so the
        rename box can drop it in as a draft the user can edit or discard.
        Blocking (a few seconds) and best-effort: 502 means the model was
        unreachable or answered with something that doesn't read as a title.
      operationId: generateAgentTitle
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedTitleResponse'
        '400':
          description: Bad Request (e.g. the agent has no task prompt to summarise)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Bad Gateway (the title model failed or gave an unusable answer)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/config:
    get:
      summary: Get the merged configuration
      operationId: getConfig
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [project, user, local]
          description: Load only a specific scope's raw config instead of the merged config (local = the untracked per-user .hydra/config.local.toml)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Save configuration changes
      operationId: saveConfig
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: scope
          required: false
          schema:
            type: string
            enum: [project, user, local]
          description: Which config file to save to - project (.hydra/config.toml), user (~/.config/hydra/config.toml) or local (the untracked per-user .hydra/config.local.toml). Defaults to project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigResponse'
      responses:
        '200':
          description: OK
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/services:
    get:
      summary: Get the live status of the project's supervised services
      operationId: getServices
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/services/restart:
    post:
      summary: Restart the project's supervised services (picks up config changes)
      operationId: restartServices
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatusResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/tree:
    get:
      summary: List the files tracked in the project's repository
      operationId: getRepositoryTree
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref to read the tree from (defaults to HEAD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryTreeResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/diff:
    get:
      summary: Diff two refs in the project's repository
      description: >-
        Returns the diff between two arbitrary refs (branches or commits) in the
        project's repository. Used by the repository browser's diff view to
        compare the branch being viewed against another branch. Uses a two-dot
        diff (base..head) - the literal difference between the two trees.
      operationId: getRepositoryDiff
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: base_ref
          required: true
          schema:
            type: string
          description: Base ref (branch or commit) to diff from
        - in: query
          name: head_ref
          required: true
          schema:
            type: string
          description: Head ref (branch or commit) to diff to
        - in: query
          name: ignore_whitespace
          required: false
          schema:
            type: boolean
          description: Ignore whitespace changes in the diff
        - in: query
          name: path
          required: false
          schema:
            type: string
          description: Only return the diff for this specific file path
        - in: query
          name: context
          required: false
          schema:
            type: integer
            default: 3
          description: Number of lines of context to show (defaults to 3)
        - in: query
          name: full_context
          required: false
          schema:
            type: boolean
          description: >-
            Return each file's full content (so the client can expand context
            without further round-trips), in a single request for all files.
            Files larger than max_full_lines are returned at the normal context
            instead. Combined with path it expands just that file, which is how
            the client promotes a single big file (left windowed by the bulk
            caps) once the reader expands it - pass caps above the bulk ones.
        - in: query
          name: max_full_changes
          required: false
          schema:
            type: integer
            default: 1000
          description: >-
            Only auto-expand files with at most this many changed lines. Only
            meaningful with full_context.
        - in: query
          name: max_full_lines
          required: false
          schema:
            type: integer
            default: 6000
          description: >-
            Upper bound on the full content shipped per expanded file. Only
            meaningful with full_context.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/file:
    get:
      summary: Read the contents of a file in the project's repository
      operationId: getRepositoryFile
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: path
          required: true
          schema:
            type: string
          description: Repo-relative path of the file to read
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref to read the file from (defaults to HEAD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryFileResponse'
        '404':
          description: Project or file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/branches:
    get:
      summary: List the branches available for the project's repository
      operationId: getRepositoryBranches
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryBranchesResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/push-status:
    get:
      summary: Report whether the repository's current branch has commits to push
      description: >-
        Inspects the project root's currently checked-out branch and reports how
        far it is ahead of the remote it would be pushed to. Uses the last-known
        remote-tracking refs and does NOT contact the network, mirroring how
        `git status` reports ahead/behind. The sidebar uses this to enable or
        disable the Push button.
      operationId: getRepositoryPushStatus
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPushStatus'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/push:
    post:
      summary: Push the repository's current branch to its remote
      description: >-
        Pushes the project root's currently checked-out branch to the remote it
        tracks (or origin), setting upstream tracking if not already configured.
        Requires network access; runs in the daemon, outside any agent sandbox.
        Returns the refreshed push status, with ahead normally back to zero.
      operationId: pushRepository
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK (branch pushed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPushStatus'
        '400':
          description: Bad Request (nothing to push, detached HEAD, or no remote)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error (e.g. push rejected or auth failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/sync:
    post:
      summary: Synchronise the repository's current branch with its remote
      description: >-
        Fetches, integrates the remote's commits into the local branch (a pull:
        fast-forward or merge), then pushes any local commits. The one-click
        "sync" the sidebar button performs. Requires network access; runs in the
        daemon, outside any agent sandbox. Returns the refreshed push status,
        normally with both ahead and behind back to zero.
      operationId: syncRepository
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      responses:
        '200':
          description: OK (branch synced)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPushStatus'
        '400':
          description: Bad Request (detached HEAD or no remote)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (the pull could not be merged cleanly)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeConflictError'
        '500':
          description: Internal Server Error (e.g. fetch/push rejected or auth failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/commit:
    post:
      summary: Commit the given uncommitted paths in the project root
      description: >-
        Stages exactly the requested paths (tracked and untracked) and commits
        them with the given message; other dirty paths are left untouched.
        Backs the sidebar's uncommitted-changes warning, whose main job is
        sweeping up config edits the web UI itself writes to
        .hydra/config.toml - the UI sends the paths it showed the user.
        Requested paths that are no longer dirty are skipped. Returns the
        refreshed push status.
      operationId: commitRepository
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRepositoryRequest'
      responses:
        '200':
          description: OK (changes committed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryPushStatus'
        '400':
          description: Bad Request (no paths given, none still dirty, or empty message)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error (e.g. the commit itself failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/artifacts:
    get:
      summary: List the artifact scripts configured at a ref
      description: >-
        Lists the names of the enabled [artifacts.<name>] scripts defined in the
        ref's .hydra/config.toml. This is cheap - it only reads config and does
        NOT generate anything. The repository browser uses it to decide whether
        to show the dynamic ".hydra/artifacts" folder and what to list inside it.
      operationId: getRepositoryArtifacts
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref whose config to read (defaults to HEAD)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryArtifactsResponse'
        '404':
          description: Project Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/repository/artifacts/{name}:
    get:
      summary: Generate (or load) one artifact script's output for a ref
      description: >-
        Runs (or returns the cached result of) the named [artifacts.<name>] script
        against a single ref and reports its outputs single-sided (no diff -
        the repository browser shows one ref at a time). Generation is lazy:
        this is only called when the user opens the script in the browser.
      operationId: getRepositoryArtifact
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: name
          required: true
          schema:
            type: string
          description: The artifact script name
        - in: query
          name: ref
          required: false
          schema:
            type: string
          description: Git ref to generate the artifact for (defaults to HEAD)
        - in: query
          name: refresh
          required: false
          schema:
            type: boolean
          description: When true, discard the cached result and regenerate (chiefly to retry a cached failure)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryArtifactResponse'
        '404':
          description: Project not found, or no such script configured at the ref
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}:
    get:
      summary: Get a specific Hydra agent by ID
      operationId: getAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update a Hydra agent's mutable fields (currently its title)
      operationId: updateAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Kill a Hydra agent by ID
      operationId: killAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Agent killed)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project_id}/agents/{id}/purge:
    delete:
      summary: Permanently delete an agent (kill it and erase every record, including its Claude session history)
      description: >-
        Irreversibly removes the agent: stops any live session, removes its
        worktree/branch and on-disk status files, deletes its Claude
        session-history directory, and hard-deletes the database record so it no
        longer appears even in the archived-history list. Works on both live and
        archived agents.
      operationId: purgeAgent
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
          description: Project ID
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (Agent permanently deleted)
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (operation already in progress)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    GeneratedTitleResponse:
      type: object
      required: [title]
      properties:
        title:
          type: string
          description: The generated title. Not persisted - the client offers it as a draft.

    ErrorResponse:
      type: object
      required: [error, code, details]
      properties:
        error:
          type: string
          description: "Machine-readable error type (e.g. internal_error, not_found, unauthorized, docker_connect)"
          enum: [not_found, unauthorized, internal_error, docker_connect, path_not_found, not_a_git_repo, bad_request, conflict]
        code:
          type: integer
          description: "HTTP status code"
        details:
          type: string
          description: "Human-readable error description"

    MergeConflictError:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: string
              # merge_conflict: the two branches conflict in content.
              # uncommitted_changes: the destination has uncommitted local changes
              #   the merge would overwrite (see conflicting_files); commit or stash.
              # conflict: the operation is already in progress.
              # tests_failing: the head's tests are failing (soft gate; pass force=true).
              # tests_errored: the head's tests couldn't run / are still running
              #   (soft gate; pass force=true). See failing_tests for the count.
              enum: [merge_conflict, uncommitted_changes, conflict, tests_failing, tests_errored]
            conflicting_files:
              type: array
              items:
                type: string
              description: >-
                For uncommitted_changes, the destination files with uncommitted
                local changes that the merge would overwrite.
            failing_tests:
              type: integer
              nullable: true
              description: >-
                For tests_failing, how many test cases are failing on the head's
                commit (so the force-merge confirm can name the count).

    StatusResponse:
      type: object
      properties:
        status:
          type: string
          example: "OK"
        sandbox_error:
          type: string
          nullable: true
          description: "Error message if the sandbox backend is unavailable or misconfigured"
        version:
          type: string
          example: "1.0.0"
        uptime_seconds:
          type: number
          format: float
          description: Seconds since the server started
        project_root:
          type: string
          description: Absolute path to the default project root (server CWD)
        default_project_id:
          type: string
          description: Project ID of the default (CWD) project
        development:
          type: boolean
          description: >
            Whether the server is being served out of a Hydra source checkout,
            which is what enables developer affordances such as the Chrome
            DevTools workspace endpoint.
        can_restart:
          type: boolean
          description: >
            Whether the server can restart itself in place (re-exec). False on
            platforms without exec.
        can_update:
          type: boolean
          description: >
            Whether the server can rebuild itself from source and restart into
            the result. Requires the daemon's project root to be a Hydra
            checkout with mage available.

    ClaudeUsageResponse:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: True when a usable usage snapshot was obtained.
        error:
          type: string
          nullable: true
          description: Why usage is unavailable (CLI missing, not a subscription account, parse failure, ...).
        captured_at:
          type: string
          format: date-time
          description: When the snapshot was probed.
        account_tier:
          type: string
          nullable: true
          description: Detected plan, e.g. "Claude Max" or "Claude Pro".
        session_percent_used:
          type: number
          format: float
          nullable: true
          description: Percent of the current session ("4 hour") limit used (0-100).
        session_resets_at:
          type: string
          format: date-time
          nullable: true
          description: When the current session limit resets (derived from the relative "Resets in ..." text).
        session_reset_text:
          type: string
          nullable: true
          description: Raw session reset text, e.g. "Resets in 2h 15m".
        weekly_percent_used:
          type: number
          format: float
          nullable: true
          description: Percent of the weekly (all-models) limit used (0-100).
        weekly_reset_text:
          type: string
          nullable: true
          description: Raw weekly reset text, e.g. "Resets Jan 15, 3:30pm".

    ProjectInfo:
      type: object
      required: [id, path, name]
      properties:
        id:
          type: string
          description: Unique project identifier (derived from folder name)
        path:
          type: string
          description: Absolute filesystem path to the project root
        display_path:
          type: string
          description: >-
            The project path for display, with the server's home directory
            abbreviated to "~" (e.g. "~/code/hydra"). Computed server-side
            because only the server knows its HOME. Falls back to `path`
            verbatim when the path is not under HOME.
        name:
          type: string
          description: Human-readable project name (last path component)
        builtin:
          type: boolean
          description: >-
            True for a project Hydra created and owns rather than one the user
            registered - currently only the chat project (id `_chat`).
            Built-ins are pinned in the project list, render without their path,
            and hide the spawn form's base-branch picker. They must be excluded
            when testing whether the user has any projects yet.
        hidden:
          type: boolean
          description: >-
            True when the user has hidden this project. A hidden project is left
            out of the project dropdown and the Ctrl+` switcher unless it is the
            project currently selected, and is always listed while the dropdown
            is in "Edit list" mode (which is where it is hidden/shown again).
            Per-machine, like the list order - it is stored in the local project
            list, not in the project's committed config.
        icon:
          type: string
          description: >-
            Optional custom project icon that replaces the default folder glyph.
            Interpreted by its content by the web UI: an emoji is rendered as-is; a
            lucide-react icon name (e.g. "Rocket") renders that icon; a value ending
            in an image extension (.png/.svg/.ico/.jpg/...) is an image - an http(s)
            or data: URI is used directly, any other value is a path served from the
            project by the backend. Empty = the default folder icon.
        unread_count:
          type: integer
          description: Number of this project's agents with unread changes. Drives the cross-project "updates waiting" indicator.
        needs_input_count:
          type: integer
          description: Number of this project's agents currently blocked on the user (status `needs_input`). Drives the red "needs your input" indicator, which is shown whenever this is greater than zero.
        agent_count:
          type: integer
          description: Total number of this project's active (non-ephemeral, non-archived) agents. Drives the project switcher's per-project agent tally.
        running_count:
          type: integer
          description: Number of this project's active agents currently in the `running` status.
        waiting_count:
          type: integer
          description: Number of this project's active agents currently in the `waiting` (gone quiet) status.
        finished_count:
          type: integer
          description: Number of this project's active agents currently in the `finished` status (done but not yet archived).

    ConfigTomlResponse:
      type: object
      required: [content, exists]
      properties:
        content:
          type: string
          description: Raw text of the project's .hydra/config.toml (empty when absent)
        exists:
          type: boolean
          description: Whether a .hydra/config.toml file is present in the project

    ResolvedPathResponse:
      type: object
      required: [path, display_path, exists, is_dir, is_git_repo]
      properties:
        path:
          type: string
          description: The absolute path the input resolves to ("~/x" and relative paths both resolve against the server's home directory)
        display_path:
          type: string
          description: The same path with the server's home directory abbreviated to "~"
        exists:
          type: boolean
          description: Whether anything exists at the resolved path
        is_dir:
          type: boolean
          description: Whether the resolved path is a directory
        is_git_repo:
          type: boolean
          description: Whether the resolved path is inside a git repository
        repo_root:
          type: string
          description: Root of the git repository containing the path, when is_git_repo (the project would be added at this path)

    TrackRemoteResponse:
      type: object
      required: [remote]
      properties:
        remote:
          type: string
          description: >-
            The configured local remote name (e.g. "hydra-agents"). Check out and
            follow a head with `git checkout -t <remote>/<head-id>` then `git pull`.

    SetProjectIconRequest:
      type: object
      required: [icon]
      properties:
        icon:
          type: string
          description: >-
            The new icon value: an emoji, a lucide-react icon name, or an image
            path/URL. An empty string clears the icon, restoring the default folder
            icon.

    SetProjectHiddenRequest:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
          description: >-
            True hides the project from the project lists, false shows it again.
            See ProjectInfo.hidden for where a hidden project still appears.

    ReorderProjectsRequest:
      type: object
      required: [project_ids]
      properties:
        project_ids:
          type: array
          items:
            type: string
          description: >-
            Project IDs in the order they should be listed. Projects the caller
            omitted (e.g. added by another window since its list was fetched)
            keep their relative order after these; unknown IDs are ignored.

    AddProjectRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Absolute filesystem path to the project root (must be a git repository)
        create_if_missing:
          type: boolean
          description: Whether to create the directory if it doesn't exist.
        init_git:
          type: boolean
          description: Whether to initialize a git repository if it's not already one.

    SpawnAgentRequest:
      type: object
      properties:
        prompt:
          type: string
          description: The prompt to give to the agent
        id:
          type: string
          description: >-
            Explicit identifier for the agent (letters/digits plus ._-, usable
            as a git branch component). When omitted, the server derives a slug
            from the prompt and uniquifies it with a -2/-3... suffix, so spawns
            can never collide. An explicit ID that already exists (active,
            archived, or in another project) fails with 409 instead of
            overwriting the existing head.
        force:
          type: boolean
          description: >-
            With an explicit id, take over an ARCHIVED head with the same ID in
            this project, overwriting its archived record (the `hydra spawn
            --force` path). Active heads and heads in other projects still
            conflict.
        agent_type:
          type: string
          description: "Agent type: claude, gemini, copilot, codex, or bash"
        model:
          type: string
          description: >-
            Model the agent CLI should use for this session (e.g. "opus",
            "sonnet", "haiku" for Claude). Passed as the CLI's --model flag at
            spawn only; on resume it is omitted so the agent restores the model
            its transcript was saved with (and honours any in-session /model
            change). Empty/omitted inherits the CLI's own default.
        base_branch:
          type: string
          description: Base branch to create the worktree from (defaults to current branch)
        adopt_mr:
          $ref: '#/components/schemas/AdoptMRRequest'
        chat_mode:
          type: boolean
          description: >-
            Drive the head via its structured protocol and render a chat view
            instead of a terminal (Claude and Codex only; rejected for other
            agent types). The prompt is delivered as the first chat turn.
        ephemeral:
          type: boolean
          description: If true, the agent is a throwaway test agent whose worktree and branch are torn down when it stops.
        git_isolation:
          type: string
          description: >-
            How much of the repo's shared .git this head may write (see
            docs/git-isolation.md). "readonly" (default) locks the whole .git
            read-only so commits go through the mcp__hydra__git_commit tool
            (anti-rogue); "off" leaves it writable. Omitted inherits the
            agent-type policy default.
        cols:
          type: integer
          description: >-
            Initial PTY width (columns), seeded from the spawning browser's last
            terminal geometry so the agent renders at the right width immediately
            instead of the 80-column default. When omitted, the server falls back
            to the project's most recently reported width (else 80).
        rows:
          type: integer
          description: >-
            Initial PTY height (rows). The browser sends its last terminal height,
            or the user's configured default height when it has none yet. When
            omitted the PTY uses its built-in 24-row default.

    UpdateAgentRequest:
      type: object
      description: >-
        Patch an agent's mutable fields. Provide any subset; at least one field
        is required. Omitted fields are left unchanged.
      properties:
        title:
          type: string
          description: New user-facing display name for the agent. Trimmed; must be non-empty if provided.
        base_branch:
          type: string
          description: >-
            New base branch for the agent. This is a metadata-only change: it
            updates which branch the agent is considered to be based on (used by
            update-from-base and the diff view) but does NOT move existing
            commits. Rebasing the agent's branch onto the new base, if desired,
            is left to the user. Must be an existing ref.
        chat_mode:
          type: boolean
          description: >-
            Switch the head between terminal and chat mode (Claude and Codex
            only; rejected for other agent types). When the value changes, a
            live process is relaunched and its provider conversation is resumed.

    AgentStatus:
      type: string
      enum:
        - pending
        - building
        - starting
        - running
        - needs_input
        - waiting
        - finished
        - stopped
        - killing
        - merging
        # NB: value is "errored", not "error" - the latter's generated Go
        # constant would collide with Go's predeclared `error` identifier, making
        # oapi-codegen fall back to type-prefixing the WHOLE enum
        # (Running -> AgentStatusRunning) and breaking every existing `api.Running`
        # reference on regeneration.
        - errored
      description: "The computed status of the agent (derived from container, agent, and head status). `needs_input` is the explicit \"the agent is blocked on you\" state (an AskUserQuestion elicitation, an ExitPlanMode plan approval, or a permission prompt) and is surfaced prominently; `waiting` is the softer \"gone quiet\" idle nudge. `errored` means the agent's turn failed mid-response (e.g. a Claude `API Error: ... The response above may be incomplete.`); the reply is incomplete and the head needs a nudge to continue - detected in chat mode from the CLI's `isApiErrorMessage` stream-json event."

    AgentStatusInfo:
      type: object
      required: [status, timestamp]
      properties:
        status:
          $ref: '#/components/schemas/AgentStatus'
        event:
          type: string
          description: "The hook event that triggered this status (SessionStart, Stop, SessionEnd, or polling)"
        timestamp:
          type: string
          description: "ISO 8601 timestamp of when the status was set"
        last_message:
          type: string
          description: "Last assistant message (present on turn-end and notification events)"
        reason:
          type: string
          description: "Session end reason (only present on SessionEnd events)"
        activity:
          type: string
          description: "Short human-readable description of the agent's current action, derived from status_log.jsonl (present while running)"
        last_message_is_suggested_next_message:
          type: boolean
          description: "True when last_message reads as a suggested next message - a terse instruction you could send straight back to the agent (e.g. 'run it') - rather than a closing summary or a question the agent is asking the user. The UI marks these with a caret."
        notification_type:
          type: string
          description: "Classifies a needs-input wait. 'policy_approval' means the security gate parked a tool call awaiting the user's allow/deny (the UI shows the approval card); 'api_error' accompanies an `error` status (the turn failed mid-response); other values come from the agent's own notifications."

    AgentResponse:
      type: object
      required: [id, project_path, session_pid, session_status, agent_type, pre_prompt, prompt, base_branch]
      properties:
        id:
          type: string
        title:
          type: string
          description: Mutable, user-facing display name. May be empty before it is seeded; clients should fall back to id.
        plan:
          type: string
          description: The chat plan/to-do list JSON the daemon tracks from the head's live Task*/TodoWrite events (empty if none).
        model:
          type: string
          description: The chat head's current model id, captured by the daemon from the CLI's system:init line (empty if not yet observed).
        branch_name:
          type: string
          nullable: true
        worktree_path:
          type: string
          nullable: true
        project_path:
          type: string
        session_pid:
          type: integer
          description: PID of the running sandbox session, or 0 if not running
        session_status:
          type: string
          description: Sandbox session status (pending|starting|running|stopped)
        agent_type:
          type: string
        pre_prompt:
          type: string
        prompt:
          type: string
        base_branch:
          type: string
        ephemeral:
          type: boolean
          description: If true, the agent is a throwaway test agent whose worktree and branch are torn down when it stops.
        chat_mode:
          type: boolean
          description: True when the head runs in structured chat mode (Claude or Codex).
        created_at:
          type: integer
          format: int64
          description: Unix timestamp (seconds) when the session was started; 0 if not started
        network_enforcement:
          type: string
          description: >-
            Network egress posture for a live head: "off" (no network),
            "unrestricted" (network on, host filtering off → every host
            reachable), "filtered-hard" (allow-list enforced in a pasta netns +
            nft lock - an inescapable boundary), "filtered-advisory" (allow-list
            enforced by the proxy via HTTP(S)_PROXY only; a determined process can
            bypass it), or absent/empty (the head isn't live).
        git_isolation:
          type: string
          description: >-
            Effective git-isolation mode for this head: "off" (the shared .git is
            writable in the sandbox) or "readonly" (the whole .git is bound
            read-only, so commits are host-mediated). See docs/git-isolation.md.
        agent_status:
          $ref: '#/components/schemas/AgentStatusInfo'
        has_unread_changes:
          type: boolean
          description: True if the agent has changes the user has not yet looked at (set on a running→waiting/finished transition, cleared when the agent is opened).
        archived:
          type: boolean
          description: True if the agent is a finished (killed/merged) head retained in the history list. Archived agents are read-only - they have no live session or worktree.
        end_state:
          type: string
          nullable: true
          description: How an archived agent ended ("killed" | "merged"); null/absent for active agents.
        archived_at:
          type: integer
          format: int64
          description: >-
            Unix timestamp (seconds) when an archived agent was killed or merged;
            absent for active agents (and for a legacy archived record with no
            recorded archive time). The archived history list is ordered by this.
        tests:
          $ref: '#/components/schemas/TestSummary'
        merge_when_green:
          type: boolean
          description: True when auto-merge is armed (the head will merge once its tests settle passing). See PLAN #68.
        publish_when_green:
          type: boolean
          description: True when publish-when-green is armed (the head auto-opens a draft MR / auto-pushes once its tests settle passing and it finishes). See docs/non-local-integration.md
        downstream_branch:
          type: string
          description: The branch name this head's work is (or will be) pushed AS on the remote. The local branch always stays hydra/<id>. Empty until set.
        review:
          $ref: '#/components/schemas/ReviewLink'

    ReviewLink:
      type: object
      description: The per-head link to a forge MR/PR (docs/non-local-integration.md). Absent on an unlinked head. When present, url/id identify the MR; state (when the lifecycle watcher has run) carries the cached forge state.
      required: [url, id, provider]
      properties:
        url:
          type: string
          description: Forge URL of the MR/PR (deep link for "View MR").
        id:
          type: string
          description: MR/PR identifier on the forge (GitLab IID / GitHub number).
        provider:
          type: string
          description: Resolved forge ("github" | "gitlab").
        target_branch:
          type: string
          description: The MR's target branch.
        ahead:
          type: integer
          description: Commits the local head branch has that the remote downstream branch does not (drives "Push to MR").
        behind:
          type: integer
          description: Commits the remote downstream branch has that the local head branch does not (drives "Pull from MR").
        state:
          $ref: '#/components/schemas/ReviewState'
        adopted:
          type: boolean
          description: True when this head was spawned ON an existing PR/MR Hydra did not create (docs/pr-adoption.md). Such a head has no "Create MR" affordance and its downstream branch (the PR author's source branch) is not editable.
        can_push:
          type: boolean
          description: Whether we may push to the adopted PR's head branch (always true for a same-repo PR; for a fork only when the author enabled maintainer edits). When false the head is read-only and the Push/Pull affordances are disabled. Only meaningful when adopted is true.

    AdoptMRRequest:
      type: object
      description: Adopt an existing PR/MR as this head instead of branching from base (docs/pr-adoption.md). The worktree is created from the PR's head commit, the head's base becomes the PR's target branch, and the head is pre-linked to the MR.
      required: [id]
      properties:
        id:
          type: string
          description: The PR number / MR iid to adopt.
        remote:
          type: string
          description: Git remote to resolve the forge against (defaults to the configured review remote, usually "origin").

    ReviewThreadsResponse:
      type: object
      description: The review conversations on a head's MR, forge threads and Hydra's local-only notes merged (docs/review-threads.md).
      required: [threads, linked]
      properties:
        threads:
          type: array
          items:
            $ref: '#/components/schemas/ReviewThread'
        linked:
          type: boolean
          description: False when the head has no MR - the diff viewer then shows local comments only.
        provider:
          type: string
          description: "\"github\" | \"gitlab\" - drives the origin badge on forge threads."
        mr_url:
          type: string
          description: The MR/PR the threads belong to.
        fetched_at:
          type: string
          description: RFC3339 time the threads were read from the forge.
        stale:
          type: boolean
          description: True when the live forge read failed and these are the last cached threads.
        error:
          type: string
          description: Why the live read failed (present with stale=true).

    ReviewThread:
      type: object
      description: One review conversation, anchored to a file/line where the forge reports one.
      required: [id, path, line, notes]
      properties:
        id:
          type: string
          description: Thread handle used for replies (GitHub - the root comment id; GitLab - the discussion id).
        path:
          type: string
        line:
          type: integer
          description: NEW-side line the thread anchors to (0 when the forge reports none).
        resolved:
          type: boolean
        outdated:
          type: boolean
          description: The anchor line no longer exists in the MR's diff.
        url:
          type: string
        notes:
          type: array
          items:
            $ref: '#/components/schemas/ReviewThreadNote'

    ReviewThreadNote:
      type: object
      description: One comment in a review thread. Local notes never reach the forge.
      required: [id, body, origin]
      properties:
        id:
          type: string
        author:
          type: string
        body:
          type: string
        url:
          type: string
        created_at:
          type: string
        origin:
          type: string
          enum: [forge, local_only]
          description: "\"forge\" - on the PR for everyone to see; \"local_only\" - private to this Hydra install (an agent's reply, or a note you kept to yourself). NOTE: spelled local_only, not local, because an oapi-codegen enum value colliding with another enum's (the config scopes) silently re-prefixes BOTH enums' Go constants."

    NewReviewCommentRequest:
      type: object
      required: [path, line, body]
      properties:
        path:
          type: string
        line:
          type: integer
          description: NEW-side line number, as anchored in the diff viewer.
        body:
          type: string

    ReviewReplyRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
        local:
          type: boolean
          description: Keep the reply inside Hydra instead of posting it to the forge.

    ReviewRef:
      type: object
      description: One existing PR/MR from the forge, for the adoption picker (docs/pr-adoption.md).
      required: [id, url, title, state, head_ref, target_branch, cross_repo, can_push]
      properties:
        id:
          type: string
          description: PR number / MR iid.
        url:
          type: string
        title:
          type: string
        author:
          type: string
          description: Login / username of the PR author.
        state:
          type: string
          description: Normalized state (draft | open | merged | closed).
        draft:
          type: boolean
        head_ref:
          type: string
          description: Source branch name on the head repo.
        head_repo_url:
          type: string
          description: Clone URL of the repo hosting head_ref (empty for a same-repo PR).
        target_branch:
          type: string
          description: The branch the PR merges into (becomes the head's base).
        cross_repo:
          type: boolean
          description: True when the PR was raised from a fork.
        can_push:
          type: boolean
          description: Whether we can push to the PR's head branch (false = adoptable read-only only).

    ListReviewsResponse:
      type: object
      description: The open PRs/MRs available to adopt, plus the forge auth state so the picker can show a "run gh/glab auth login" hint (docs/pr-adoption.md).
      required: [configured, authenticated, reviews]
      properties:
        configured:
          type: boolean
          description: True when a forge provider could be resolved for the project.
        authenticated:
          type: boolean
          description: Whether the forge CLI is authenticated.
        provider:
          type: string
          description: Resolved provider ("github" | "gitlab" | "").
        auth_status:
          type: string
          description: Live auth status line, when not authenticated / configured.
        error:
          type: string
          description: Human-readable reason the list is empty/unavailable (not configured, CLI missing, list failed).
        reviews:
          type: array
          items: { $ref: '#/components/schemas/ReviewRef' }

    ReviewConfigResponse:
      type: object
      description: Resolved [review] config for a project plus live forge auth status (docs/non-local-integration.md).
      required: [configured, provider, remote, auth, default_action]
      properties:
        configured:
          type: boolean
          description: True when a [review] section exists (or a provider could be resolved) so the Create MR affordance should be offered.
        provider:
          type: string
          description: Resolved provider ("github" | "gitlab" | "") - empty when auto-detection could not decide.
        provider_setting:
          type: string
          description: The raw provider setting ("auto" | "github" | "gitlab").
        remote:
          type: string
        remote_url:
          type: string
          description: The URL of the configured remote (what provider detection ran against).
        browse_url:
          type: string
          description: Derived https browse URL for the repo (for the forge web link), or empty.
        auth:
          type: string
          description: Auth method ("cli" | "token").
        auth_status:
          type: string
          description: 'Live auth status line (e.g. "gh: logged in as X" / "glab: not authenticated").'
        authenticated:
          type: boolean
          description: Whether the forge CLI is authenticated.
        default_action:
          type: string
          description: Primary head action ("merge" | "create_mr").
        push_branch_template:
          type: string
        draft:
          type: boolean
        squash:
          type: boolean
        delete_remote_branch:
          type: boolean
        require_local_tests:
          type: boolean
        publish_when_green:
          type: boolean
          description: Default arming for new heads.
        protected_branches:
          type: array
          items: { type: string }

    ReviewConfig:
      type: object
      description: >-
        The raw [review] config for ONE config layer (project / user / local),
        as edited in the Settings scope tabs. Every field is nullable; a null
        field is unset at this layer and inherits the layer below (built-in
        defaults are applied only in the resolved ReviewConfigResponse). Which
        file a save writes to is chosen by the scope tab, so provider/target/etc.
        can live in the shared config.toml and personal overrides in config.local.toml.
      properties:
        provider:
          type: string
          nullable: true
          description: '"auto" | "github" | "gitlab".'
        remote:
          type: string
          nullable: true
        auth:
          type: string
          nullable: true
          description: '"cli" | "token".'
        default_action:
          type: string
          nullable: true
          description: '"merge" | "create_mr".'
        push_branch_template:
          type: string
          nullable: true
        draft:
          type: boolean
          nullable: true
        squash:
          type: boolean
          nullable: true
        delete_remote_branch:
          type: boolean
          nullable: true
        require_local_tests:
          type: boolean
          nullable: true
        publish_when_green:
          type: boolean
          nullable: true
        protected_branches:
          type: array
          items: { type: string }
          nullable: true

    ResourceLimits:
      type: object
      description: >-
        The raw [resources] cgroup limits for ONE config layer (project / user /
        local), as edited in the Settings scope tabs. Applied to every scoped
        workload of the project (agent, preview, service, artifact) via its
        transient systemd scope. Every field is nullable; a null field is unset at
        this layer and inherits the layer below (built-in defaults - weights on
        50/50, hard caps off - are applied only when resolving). Weights are soft
        (bite only under contention); the hard caps apply even on an idle box and
        may be silently skipped where their cgroup controller is not delegated to
        the user systemd manager.
      properties:
        cpu_weight:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          description: Relative CPU share under contention (systemd CPUWeight, 1-10000). null uses the default (50).
        io_weight:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10000
          description: Relative block-IO share under contention (systemd IOWeight, 1-10000). null uses the default (50).
        cpu_quota:
          type: integer
          nullable: true
          minimum: 0
          description: Hard CPU cap in percent of one core (systemd CPUQuota; 200 = 2 cores). null/0 = no cap.
        memory_max:
          type: integer
          nullable: true
          minimum: 0
          description: Hard memory ceiling in MB (systemd MemoryMax); the cgroup is OOM-killed past it. null/0 = no cap.
        tasks_max:
          type: integer
          nullable: true
          minimum: 0
          description: Hard cap on processes/threads (systemd TasksMax); guards against fork bombs / PID exhaustion. null/0 = no cap.

    ReviewState:
      type: object
      description: Cached forge MR state from the lifecycle watcher (Phase 3). Absent until the watcher has polled.
      required: [state]
      properties:
        state:
          type: string
          description: Normalized MR state (draft | open | merged | closed).
        ci_status:
          type: string
          description: Normalized CI status (success | failed | running | pending | none).
        approvals:
          type: integer
        approvals_required:
          type: integer
        unresolved_discussions:
          type: integer
        mergeable:
          type: boolean

    TestSummary:
      type: object
      required: [status]
      description: >-
        Compact per-head test verdict for the head's current commit, shown as the
        sidebar/header chip without opening the tests panel (PLAN #68). Computed
        from the cached report without triggering a run.
      properties:
        status:
          $ref: '#/components/schemas/TestStatus'
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        warnings:
          type: integer
          description: Non-failing diagnostics (e.g. eslint warnings). Informational only - never part of the merge gate. Shown in the long chip / panel, not the short sidebar chip.
        duration_ms:
          type: integer
          format: int64
          nullable: true
        progress:
          type: string
          nullable: true
          description: Latest progress line while status is "running" (e.g. "84/142").
        ref:
          type: string
          nullable: true
          description: The resolved commit SHA the verdict was computed for.
        at_base:
          type: boolean
          nullable: true
          description: >-
            True when the head's branch tip is still the base branch commit, so
            this verdict is inherited from the base rather than the agent's own
            work. The ambient sidebar chip hides it in this case; the agent
            detail view still shows it.

    CommitInfo:
      type: object
      required: [sha, short_sha, message, author_name, author_email, timestamp]
      properties:
        sha:
          type: string
          description: Full 40-character commit SHA
        short_sha:
          type: string
          description: Abbreviated 7-character commit SHA
        message:
          type: string
          description: Full commit message
        subject:
          type: string
          description: First line of the commit message
        author_name:
          type: string
        author_email:
          type: string
        timestamp:
          type: string
          description: ISO 8601 timestamp of the author date

    RepositoryTreeResponse:
      type: object
      required: [ref, files]
      properties:
        ref:
          type: string
          description: The git ref the tree was read from (e.g. HEAD)
        default_path:
          type: string
          nullable: true
          description: Suggested file to open first (README.md when present), or null
        files:
          type: array
          items:
            type: string
          description: Repo-relative paths of every file tracked at this ref

    RepositoryFileResponse:
      type: object
      required: [path, ref, size, binary, truncated, symlink]
      properties:
        path:
          type: string
          description: Repo-relative path of the file
        ref:
          type: string
          description: The git ref the file was read from
        size:
          type: integer
          description: File size in bytes
        binary:
          type: boolean
          description: True when the file looks binary; content is then omitted
        truncated:
          type: boolean
          description: True when content was truncated because the file is large
        content:
          type: string
          nullable: true
          description: UTF-8 file content (omitted for binary files)
        symlink:
          type: boolean
          description: True when the requested path is a symbolic link; the other fields then describe the link's target
        symlink_target:
          type: string
          nullable: true
          description: The link's target exactly as stored (relative or absolute), set when symlink is true
        target_path:
          type: string
          nullable: true
          description: Repo-relative path of the file the symlink ultimately resolves to (whose content is returned); null when the link is broken, escapes the repo, or points at a directory

    RepositoryBranch:
      type: object
      required: [name, is_agent, is_current]
      properties:
        name:
          type: string
          description: Branch name (e.g. main, hydra/my-task)
        is_agent:
          type: boolean
          description: True for Hydra agent branches (hydra/*), which are listed first
        is_current:
          type: boolean
          description: True for the repository's currently checked-out branch (HEAD)

    RepositoryBranchesResponse:
      type: object
      required: [current, branches]
      properties:
        current:
          type: string
          description: The repository's currently checked-out branch (HEAD), or "" when detached
        branches:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryBranch'
          description: Branches ordered with Hydra agent branches first, then the rest

    RepositoryPushStatus:
      type: object
      required: [can_push, ahead, behind, has_remote, uncommitted]
      properties:
        branch:
          type: string
          nullable: true
          description: The repository's current branch, or null when HEAD is detached
        remote:
          type: string
          nullable: true
          description: The remote a push would target (e.g. "origin"), or null if none
        ahead:
          type: integer
          description: Number of commits on the current branch not yet on the remote
        behind:
          type: integer
          description: >-
            Number of commits the remote-tracking branch has that the local
            branch does not. Reflects the last fetch (the server fetches in the
            background); 0 when the branch isn't on the remote yet.
        has_remote:
          type: boolean
          description: True if the repository has a remote to push to
        can_push:
          type: boolean
          description: True if there is a branch, a remote, and at least one commit to push
        uncommitted:
          $ref: '#/components/schemas/RepositoryUncommittedChanges'

    RepositoryUncommittedChanges:
      type: object
      required: [total, files]
      description: >-
        Uncommitted changes in the project root's working tree. Drives the
        sidebar warning that config edits (e.g. the web UI writing
        .hydra/config.toml) are sitting uncommitted.
      properties:
        total:
          type: integer
          description: Total number of uncommitted paths (tracked changes + untracked files)
        files:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryUncommittedFile'
          description: >-
            The uncommitted paths in git's status order, truncated to the first
            20 when total exceeds that.

    RepositoryUncommittedFile:
      type: object
      required: [path, status]
      properties:
        path:
          type: string
          description: Repo-relative path of the uncommitted file
        status:
          type: string
          description: One of modified|added|deleted|renamed|copied|conflicted|untracked

    CommitRepositoryRequest:
      type: object
      required: [message, paths]
      properties:
        message:
          type: string
          description: The commit message; must be non-blank
        paths:
          type: array
          items:
            type: string
          description: >-
            Repo-relative paths to commit, as reported by the push-status
            uncommitted file list; must be non-empty

    RepositoryArtifactScript:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The configured artifact script name

    RepositoryArtifactsResponse:
      type: object
      required: [ref, scripts]
      properties:
        ref:
          type: string
          description: The git ref the script list was read from
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryArtifactScript'
          description: The enabled artifact scripts defined at this ref, sorted by name

    RepositoryArtifactFile:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Output file's relative path (forward-slashed)
        size:
          type: integer
          format: int64
          nullable: true
          description: File size in bytes; labels download-class tiles (an .apk, a .zip)
        url:
          type: string
          nullable: true
          description: URL to fetch the file's bytes (an artifacts blob URL); null while still generating
        tags:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Labels for this file, read from a sibling JSON sidecar
            (<file>.meta, {"tags": [...]}). A "category::value" tag is a scoped
            label. Null/absent when the file has no tags.
        fps:
          type: number
          format: double
          nullable: true
          description: Frame rate of a video file, read from its sidecar; sizes the video viewer's frame-step.
        width:
          type: integer
          nullable: true
          description: >-
            Natural pixel width of the media, measured server-side at generation
            time (image header, or ffprobe for video) and cached in the entry's
            meta.json. Lets the grid lay out tiles without downloading every file
            to measure it, and avoids upscaling a low-resolution shot. Best-effort:
            null/absent when it could not be determined.
        height:
          type: integer
          nullable: true
          description: Natural pixel height of the media; see width. Null/absent when undetermined.
        dpi:
          type: number
          format: double
          nullable: true
          description: >-
            Pixel density (device-scale factor) the media was captured at, from its
            sidecar ({"dpi": 2}); the grid sizes tiles by logical width (width / dpi).
            Null/absent → 1.

    RepositoryArtifactResponse:
      type: object
      required: [name, status, files]
      properties:
        name:
          type: string
          description: The artifact script name
        status:
          type: string
          enum: [ready, generating, error]
        error:
          type: string
          nullable: true
          description: Set only when generation failed (status "error").
        started_at:
          type: integer
          format: int64
          nullable: true
          description: Unix time (seconds) generation started, so the UI can show elapsed time. Only set while generating.
        progress:
          type: string
          nullable: true
          description: >-
            Latest progress line of the in-flight generation, from
            `::hydra:progress::` marker lines (falling back to the latest stdout
            line). Only set while generating.
        log:
          type: array
          nullable: true
          description: >-
            Captured stdout+stderr lines of the in-flight generation, surfaced
            as a live log. Only populated while generating; once settled, fetch
            log_url instead.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        log_url:
          type: string
          nullable: true
          description: URL to fetch the persisted build log once generation has settled. Null while generating or if no log was captured.
        files:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryArtifactFile'

    DiffLine:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [context, addition, deletion, no_newline]
          description: "context: unchanged line; addition: added line; deletion: removed line; no_newline: no newline at end of file"
        content:
          type: string
          description: Line content without the diff prefix character
        old_line_num:
          type: integer
          nullable: true
          description: Line number in the old file (null for additions)
        new_line_num:
          type: integer
          nullable: true
          description: Line number in the new file (null for deletions)

    DiffHunk:
      type: object
      required: [header, old_start, new_start, lines]
      properties:
        header:
          type: string
          description: The @@ ... @@ hunk header line
        old_start:
          type: integer
          description: Starting line number in the old file
        new_start:
          type: integer
          description: Starting line number in the new file
        lines:
          type: array
          items:
            $ref: '#/components/schemas/DiffLine'

    DiffFile:
      type: object
      required: [path, change_type, additions, deletions, binary, hunks]
      properties:
        path:
          type: string
          description: File path (new path for renamed files)
        old_path:
          type: string
          nullable: true
          description: Original file path (only set for renamed files)
        change_type:
          type: string
          enum: [added, modified, deleted, renamed]
        additions:
          type: integer
          description: Number of added lines
        deletions:
          type: integer
          description: Number of deleted lines
        binary:
          type: boolean
          description: True if this is a binary file
        expanded:
          type: boolean
          description: >-
            True when hunks contain the file's entire content as a single
            whole-file hunk (full_context view), so the client can drive the
            context reveal/collapse model without re-fetching. Absent/false means
            the file is shown at the requested windowed context.
        head_blob_sha:
          type: string
          nullable: true
          description: >-
            git blob sha of the file's content on the head side of the
            comparison (from the head tree, or a hash-object of the working-tree
            file for an uncommitted diff). Absent for a deletion or when it can't
            be resolved. The client keys per-file "viewed" state on it, so a file
            re-shows as unviewed exactly when its content changes.
        hunks:
          type: array
          items:
            $ref: '#/components/schemas/DiffHunk'

    DiffResponse:
      type: object
      required: [files, base_ref, head_ref]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/DiffFile'
        base_ref:
          type: string
          description: The base ref used for this diff
        head_ref:
          type: string
          description: The head ref used for this diff
        merge_conflict:
          type: boolean
          description: True if there are merge conflicts between base_ref and head_ref
        conflict_files:
          type: array
          description: List of files with merge conflicts (populated when merge_conflict is true)
          items:
            type: string
        uncommitted_changes:
          type: boolean
          description: True if there are uncommitted changes in the worktree
        uncommitted_summary:
          description: Counts of uncommitted changes in the worktree
          $ref: '#/components/schemas/UncommittedSummary'
        behind_count:
          type: integer
          description: Number of commits on the base branch not yet merged into the agent branch (how far behind the base the branch is)
        base_commit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommitInfo'
          description: Details of the base commit (if a specific commit SHA was given)
        head_commit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CommitInfo'
          description: Details of the head commit

    UncommittedSummary:
      type: object
      required: [tracked_count, untracked_count]
      properties:
        tracked_count:
          type: integer
          description: Number of tracked files with staged or unstaged changes
        untracked_count:
          type: integer
          description: Number of untracked (new, never-added) files
        tracked_files:
          type: array
          description: Paths of the tracked files with staged or unstaged changes (capped; may be shorter than tracked_count)
          items:
            type: string
        untracked_files:
          type: array
          description: Paths of the untracked files (capped; may be shorter than untracked_count)
          items:
            type: string

    AgentInputRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: Text to send to the agent's stdin (a newline is appended automatically)

    ApprovalRequest:
      type: object
      required: [reqid, tool, kind, target, summary]
      properties:
        reqid:
          type: string
          description: Unique ID of the parked approval request
        tool:
          type: string
          description: The tool the agent tried to use (e.g. WebFetch or an mcp__ name)
        kind:
          type: string
          description: "What is being approved: 'mcp', 'mcp_tool', 'webfetch', 'egress', 'bash', or 'host_command' (run a command on the host, outside the sandbox)"
        target:
          type: string
          description: The MCP server name, '<server>__<tool>', host, or command the approval is about (for host_command, the full command text)
        reason:
          type: string
          description: One-line explanation of why the gate parked the call
        summary:
          type: string
          description: Human-readable "wants to ..." summary for the approval card
        rw:
          type: string
          nullable: true
          description: >-
            Read/write classification of an mcp_tool request ("read", "write", or
            absent when unknown/not applicable). Best-effort heuristic - a badge
            hint, not a guarantee.
        url:
          type: string
          nullable: true
          description: The full request URL for a webfetch request (previewed in the card).
        args_preview:
          type: string
          nullable: true
          description: Compact one-line preview of an mcp_tool call's arguments.
        description:
          type: string
          nullable: true
          description: >-
            The agent's own explanation of what it is asking for and why it needs
            to happen outside the sandbox (`hydra host-run --why`). Shown above
            the command in the approval card, so the user judges a stated intent
            rather than reverse-engineering one from a shell script.
        ts:
          type: string
          description: ISO 8601 timestamp the request was raised

    ApprovalListResponse:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'

    ApprovalDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [allow, deny]
          description: The user's verdict for the parked tool call
        remember:
          type: boolean
          description: "When true and decision is allow, persist the server/host to the trusted config's allow-list so future launches don't ask again"
        command:
          type: string
          description: >-
            For a host_command approval only: the exact command text the UI
            displayed and the user approved. The daemon runs THIS text verbatim
            (never re-reading the head-writable request file), which closes the
            TOCTOU window where an agent could swap the command after the user
            saw it. Ignored for every other kind.

    NetworkConfig:
      type: object
      properties:
        mode:
          type: string
          nullable: true
          enum: [off, unrestricted, advisory, hard, on]
          description: >-
            Egress posture: "off" (no network), "unrestricted" (network, no host
            filtering), "advisory" (proxy-only host filtering - every honest
            client is filtered, but escapable), or "hard" (inescapable pasta+nft
            netns, failing closed - no network - when the boundary can't be
            built; "on" is a synonym for "hard"). Null/unset = default
            ("hard"). Supersedes the legacy enabled/filter_enabled booleans.
        enabled:
          type: boolean
          nullable: true
          description: LEGACY (use mode). Honoured only when mode is unset.
        filter_enabled:
          type: boolean
          nullable: true
          description: LEGACY (use mode). Honoured only when mode is unset.
        allowed_hosts:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            Extra outbound hosts (exact host or *.suffix) allowed when filtering
            is on, unioned on top of the built-in default allow-list.
        blocked_hosts:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            Outbound hosts (exact host or *.suffix) denied even when otherwise
            allowed - overrides both allowed_hosts and the built-in defaults.
        allowed_loopback_ports:
          type: array
          items:
            type: integer
          nullable: true
          description: >-
            Host-loopback TCP ports reachable from the sandbox even under mode
            "hard", whose network namespace otherwise cuts off the host's
            127.0.0.1 - for host-local daemons that hardcode loopback, e.g.
            adb's server on 5037. No effect in other modes (they share the
            host loopback already).

    SandboxConfig:
      type: object
      description: User-editable sandbox policy, additive on top of baked-in defaults
      properties:
        writable_paths:
          type: array
          items:
            type: string
          nullable: true
        masked_paths:
          type: array
          items:
            type: string
          nullable: true
        restore_ro:
          type: array
          items:
            type: string
          nullable: true
        cow_paths:
          type: array
          items:
            type: string
          nullable: true
          description: Paths mounted copy-on-write. The agent reads the real files and may overwrite them, but writes are kept per-head and never touch the source. A worktree-relative entry (pipeline/out) is mirrored from the project root into the worktree; a home/absolute entry (~/.gradle, /opt/cache), resolved against HOME, is overlaid in place and supersedes any default writable bind on it. For large gitignored build dirs or shared tool caches too big to copy. On Linux needs an overlay-capable bwrap.
        pre_spawn_script:
          type: string
          nullable: true
          description: Bash script run inside the sandbox before every agent launch - both spawn and resume - so it must be idempotent. Not run for bash shells (e.g. `mise trust`)
        pre_exit_script:
          type: string
          nullable: true
          description: Bash script run in a sandbox when a head ends, after the agent's session is killed but before its worktree is removed. Runs with the head's sandbox policy, cwd = worktree, with HYDRA_* head context + HYDRA_END_STATE. For per-head teardown such as releasing a claimed resource.
        network:
          $ref: '#/components/schemas/NetworkConfig'
          nullable: true

    AgentConfig:
      type: object
      properties:
        sandbox:
          $ref: '#/components/schemas/SandboxConfig'
          nullable: true
        policy:
          $ref: '#/components/schemas/PolicyConfig'
          nullable: true
        pre_prompt:
          type: string
          nullable: true
        fullscreen:
          type: boolean
          nullable: true
          description: Enable Claude Code's fullscreen (alternate-screen) rendering. Claude only; off by default so the web terminal keeps its native scrollbar and select-to-copy.

    PolicyConfig:
      type: object
      description: >-
        Per-agent security-gate policy. The decision-capable gate can deny (or
        park for approval) tool calls even under skip-permissions.
      properties:
        gate_enabled:
          type: boolean
          nullable: true
          description: Enable the decision-capable gate (default true when unset).
        git_isolation:
          type: string
          nullable: true
          description: >-
            How much of the repo's shared .git the head may write: "readonly"
            (default, whole .git bound read-only, commits host-mediated) or "off"
            (writable). Unset inherits the default (readonly). See
            docs/git-isolation.md.
        mcp_allowed:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            MCP server names the agent may use (whole-server grant). Servers not
            listed (nor referenced by mcp_tools_allowed) are stripped from the
            seeded config pre-launch (never spawn). Deny-by-default.
        mcp_tools_allowed:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            Individual MCP tools ("<server>__<tool>") allowed even when the whole
            server is not. The server is kept (spawned) so those tools work; its
            other tools park for approval at runtime.
        mcp_blocked:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            MCP server names refused outright - stripped pre-launch and DENIED at
            runtime (never parked for approval). Block overrides allow; since the
            allow-lists union across config layers, this is how a narrower layer
            removes a server a broader layer granted.
        mcp_tools_blocked:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            Individual MCP tools ("<server>__<tool>") denied outright even when
            their server is allowed. Block overrides allow.
        mcp_auto_allow_read:
          type: boolean
          nullable: true
          description: >-
            Auto-allow MCP tools the read/write classifier deems read-only,
            parking only writes/unknown. Best-effort heuristic; off by default.
        strict_mcp:
          type: boolean
          nullable: true
          description: >-
            Make the allow-list the agent's only source of MCP servers: Hydra
            renders them (plus its own control server) into a per-head config
            and launches with --strict-mcp-config, so the host's ~/.claude.json
            and a branch's .mcp.json are ignored outright rather than filtered.
            Costs the claude.ai account connectors (Gmail/Calendar/Drive), which
            cannot be re-declared. null = on (the default).
        known_tools:
          type: array
          items:
            type: string
          nullable: true
          description: >-
            Extra tool names the gate treats as safe, extending its built-in
            known-tool set. Not edited by the Settings UI; carried in responses
            so a round-tripped save preserves a hand-edited value.

    McpServer:
      type: object
      required: [name, source]
      description: A candidate MCP server discovered in the host/project config.
      properties:
        name:
          type: string
          description: The server key as it appears under mcpServers.
        source:
          type: string
          description: Where it was found - "user" (~/.claude.json) or "project" (.mcp.json).

    ArtifactScript:
      type: object
      required: [name, script]
      description: A per-project script that renders visual artifacts (e.g. screenshots) of a checkout, shown side-by-side in the diff viewer
      properties:
        name:
          type: string
          description: Unique label, also used as the cache directory
        script:
          type: string
          description: Shell script run via `bash -c` in the checkout directory. Written as `script` in config.toml; the older `command` key still parses and is migrated on save.
        timeout_sec:
          type: integer
          description: Max seconds the command may run (0 = built-in default)
        unsafe_host:
          type: boolean
          description: Run on the host with NO sandbox - full access to the machine and credentials (default false)
        clean_ignored:
          type: boolean
          description: Also delete git-ignored files (e.g. node_modules) before each run - a pristine checkout (git clean -fdx) instead of the default that keeps caches warm (-fd). Slower; only if stale ignored output can leak between commits (default false)
        strict:
          type: boolean
          nullable: true
          description: Run the command under `set -eo pipefail` so a failing step aborts and propagates instead of being swallowed into a success (absent/null or true = strict; false = run exactly as written)
        enabled:
          type: boolean
          nullable: true
          description: Whether the diff viewer runs this script (absent/null or true = enabled; false = skipped)
    PreviewScript:
      type: object
      required: [name, script]
      description: >-
        A per-project script that boots a live, clickable preview of the app at a
        checkout ([previews.<name>] in config.toml). Hydra proxies a dedicated port
        to it, spawning it when its link is opened and tearing it down when idle.
      properties:
        name:
          type: string
          description: Unique label, shown in the agent page's Previews row
        script:
          type: string
          description: >-
            Shell script run via `bash -c` in the checkout directory. It must start
            a server listening on $HYDRA_PREVIEW_ADDR and stay in the foreground.
        unsafe_host:
          type: boolean
          description: Run on the host with NO sandbox - full access to the machine and credentials (default false)
        strict:
          type: boolean
          nullable: true
          description: Run the command under `set -eo pipefail` so a failing build step aborts the spawn instead of serving a half-built tree (absent/null or true = strict)
        enabled:
          type: boolean
          nullable: true
          description: Whether the preview is offered on the agent page (absent/null or true = enabled; false = hidden)
        idle_timeout_sec:
          type: integer
          description: >-
            Teardown after this long with zero in-flight proxied requests; open
            WebSocket/long-poll connections count as in-flight (0 = default 300).
        ready_timeout_sec:
          type: integer
          description: Max seconds from spawn to ready, builds included (0 = default 900)

    PreviewState:
      type: string
      enum: [stopped, starting, running, error]
      x-enum-varnames: [PreviewStopped, PreviewStarting, PreviewRunning, PreviewError]
      description: Preview instance lifecycle state

    PreviewStatus:
      type: object
      required: [name, state, version]
      description: Snapshot of one live server-preview instance (or a configured-but-never-started script)
      properties:
        name:
          type: string
          description: The preview script name
        state:
          $ref: '#/components/schemas/PreviewState'
        version:
          type: string
          description: Which checkout the instance serves - "uncommitted" (the head's live worktree) or a short commit SHA
        url:
          type: string
          nullable: true
          description: Absolute URL of the preview (built from the request host and the instance's proxy port); null until a listener exists
        pid:
          type: integer
          description: Child process PID while starting/running (0 otherwise)
        connections:
          type: integer
          description: In-flight proxied requests, including open WebSocket tunnels
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the current child was spawned (null when stopped)
        progress:
          type: string
          description: "Latest ::hydra:progress:: headline while starting"
        message:
          type: string
          description: Failure detail when state is "error"
        stale:
          type: boolean
          description: '"Latest changes" channel only - the live worktree changed since this server was built, so a build-then-serve preview is out of date (restart to rebuild)'
        log:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
          description: Most recent captured output lines of the current/last spawn

    PreviewsResponse:
      type: object
      required: [previews]
      properties:
        previews:
          type: array
          items:
            $ref: '#/components/schemas/PreviewStatus'
          description: One entry per configured server script, for the requested version

    ServiceScript:
      type: object
      required: [name, script]
      description: A per-project long-running script the daemon supervises while the project is registered ([services.<name>] in config.toml)
      properties:
        name:
          type: string
          description: Unique label, shown in the UI and logs
        script:
          type: string
          description: Shell script run via `bash -c` from the project root. Written as `script` in config.toml; the older `command` key still parses and is migrated on save.
        host:
          type: boolean
          description: Run on the host with NO sandbox - needed for host devices the sandbox hides, e.g. /dev/kvm (default false)
        max_restarts:
          type: integer
          nullable: true
          description: Relaunch cap after an unexpected exit (null = default 3; 0 = never restart)
        strict:
          type: boolean
          nullable: true
          description: Run the command under `set -eo pipefail` so a failed startup step surfaces as a crash instead of a healthy process (absent/null or true = strict; false = run exactly as written)
        enabled:
          type: boolean
          nullable: true
          description: Whether the daemon supervises this service (absent/null or true = enabled; false = skipped)

    TestScript:
      type: object
      required: [name, script]
      description: A per-project test-runner script whose pass/fail verdict gates the merge button ([tests.<name>] in config.toml, PLAN #68)
      properties:
        name:
          type: string
          description: Unique label, also used as the cache directory
        script:
          type: string
          description: Shell script run via `bash -c` in the checkout directory; writes a JUnit-XML or Hydra-JSON report into $HYDRA_TEST_OUTPUT. Written as `script` in config.toml; the older `command` key still parses and is migrated on save.
        type:
          type: string
          nullable: true
          description: >-
            How results are read - "junit" (default; parse *.xml/*.json report
            files from $HYDRA_TEST_OUTPUT after exit) or "stdout" (parse
            `::hydra:test:*::` markers streamed live from stdout; the
            accumulated cases are the report, no file needed).
        timeout_sec:
          type: integer
          description: Max seconds the command may run (0 = built-in default)
        unsafe_host:
          type: boolean
          description: Run on the host with NO sandbox - runs the diffed ref's test code; only for trusted refs (default false)
        clean_ignored:
          type: boolean
          description: Also delete git-ignored files before each run (git clean -fdx instead of -fd); slower (default false)
        strict:
          type: boolean
          nullable: true
          description: Run the command under `set -eo pipefail` (absent/null or true = strict; false = run exactly as written). The verdict still comes from the parsed report, not the exit code.
        enabled:
          type: boolean
          nullable: true
          description: Whether the test gate runs this command (absent/null or true = enabled; false = skipped)

    TestStatus:
      type: string
      enum: [running, passing, failing, errored, stale, none]
      x-enum-varnames: [TestStatusRunning, TestStatusPassing, TestStatusFailing, TestStatusErrored, TestStatusStale, TestStatusNone]
      description: >-
        running = a run is in flight; passing/failing/errored = settled verdict;
        stale = a cached verdict exists but predates the current commit; none = no
        tests configured or never run. (A per-runner TestRunResult only ever uses
        running/passing/failing/errored; stale/none are head-summary states.)

    TestCaseStatus:
      type: string
      enum: [passed, failed, skipped, warning]
      x-enum-varnames: [TestCasePassed, TestCaseFailed, TestCaseSkipped, TestCaseWarning]

    TestCase:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: Leaf test name only when path/scope are set; older reports carry a pre-joined display name here with no path/scope.
        status:
          $ref: '#/components/schemas/TestCaseStatus'
        path:
          type: string
          nullable: true
          description: Repo-relative filesystem location - a file (vitest/eslint/pytest) or a package dir (Go). Absent when the runner only exposes a logical scope.
        scope:
          type: array
          items:
            type: string
          nullable: true
          description: Logical nesting chain between path and name - a class chain (com › example › FooTest), describe chain, or Go subtest parent.
        scope_kinds:
          type: array
          items:
            type: string
          nullable: true
          description: Per-level kind for `scope`, parallel to it - "module" (a describe block / package / suite), "class" (a JUnit/Java class or pytest TestClass in a dotted class chain), or "function" (a Go test function that owns subtests). A missing or short array means the level's kind is unknown; consumers treat that as "module".
        line:
          type: integer
          nullable: true
          description: 1-based line within path, when known.
        col:
          type: integer
          nullable: true
        end_line:
          type: integer
          nullable: true
        end_col:
          type: integer
          nullable: true
        duration_ms:
          type: integer
          format: int64
        message:
          type: string
          nullable: true
          description: Failure/assertion text for a failed case (or skip reason for a skipped one)
        path_missing:
          type: boolean
          nullable: true
          description: True when `path` names a file that was not found in the checkout the report was parsed against - a stale or incorrect location in the runner's output. Informational only; never affects the verdict or the warnings count.

    TestRunResult:
      type: object
      required: [name, status]
      description: One test runner's parsed result for a single ref (single-sided; no comparison)
      properties:
        name:
          type: string
          description: The configured test runner name
        status:
          $ref: '#/components/schemas/TestStatus'
        total:
          type: integer
        total_estimated:
          type: boolean
          nullable: true
          description: True when `total` is an estimated denominator carried over from a prior run (the streaming runner declared no ::hydra:test:total::). Only set while running; the UI shows it as approximate.
        queued:
          type: integer
          nullable: true
          description: >-
            The run's 1-based place in the runner queue while it waits for a
            slot; absent or 0 once it is actually running. Test concurrency
            defaults to 1, so a project with several runners commonly has some
            of them queued rather than running.
        passed:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        warnings:
          type: integer
          description: Non-failing diagnostics (e.g. eslint warnings). Informational only - never part of the merge gate.
        duration_ms:
          type: integer
          format: int64
          nullable: true
        error:
          type: string
          nullable: true
          description: Set when status is "errored" - the command couldn't produce a verdict.
        ref:
          type: string
          nullable: true
          description: Resolved commit SHA the run was computed for.
        format:
          type: string
          nullable: true
          description: Report format parsed (junit | hydra | stdout | exit). Never set while running - which format a run settles with is only known once its report has been parsed.
        started_at:
          type: integer
          format: int64
          nullable: true
          description: Unix time (seconds) the in-flight run started. Only set while running.
        progress:
          type: string
          nullable: true
          description: "Latest progress line of the in-flight run (from ::hydra:progress:: markers, else latest stdout). Only set while running."
        log:
          type: array
          nullable: true
          description: Captured stdout+stderr lines of the in-flight run. Only while running; once settled fetch log_url.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        log_url:
          type: string
          nullable: true
          description: URL to fetch the persisted build log once the run has settled.
        cases:
          type: array
          description: Parsed test cases (failing first when the UI orders them).
          items:
            $ref: '#/components/schemas/TestCase'

    TestsResponse:
      type: object
      required: [runners]
      properties:
        runners:
          type: array
          items:
            $ref: '#/components/schemas/TestRunResult'

    ConfigResponse:
      type: object
      required: [defaults, agents]
      properties:
        defaults:
          $ref: '#/components/schemas/AgentConfig'
        agents:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentConfig'
        mcp_servers:
          type: array
          items:
            $ref: '#/components/schemas/McpServer'
          nullable: true
          description: >-
            Read-only: candidate MCP servers discovered in the host ~/.claude.json
            and project .mcp.json, for populating the mcp_allowed picker. Ignored
            on save.
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactScript'
          nullable: true
          description: Per-project visual-artifact generation scripts ([artifacts.<name>] in config.toml)
        previews:
          type: array
          items:
            $ref: '#/components/schemas/PreviewScript'
          nullable: true
          description: >-
            Per-project live-server scripts, each proxied on demand as a clickable
            preview of the head's app ([previews.<name>] in config.toml). A config
            still spelling one as an [artifacts.<name>] with type = "server" is
            upgraded on read, so it appears here and not under artifacts.
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceScript'
          nullable: true
          description: Per-project long-running supervised commands ([services.<name>] in config.toml)
        tests:
          type: array
          items:
            $ref: '#/components/schemas/TestScript'
          nullable: true
          description: Per-project test-runner commands whose verdict gates merge ([tests.<name>] in config.toml)
        test_concurrency:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Max test-runner generations that run at once (test_concurrency in
            config.toml). 0 = unlimited; null/absent uses the built-in default.
        test_prefetch:
          type: boolean
          nullable: true
          description: >-
            Whether the daemon proactively re-runs a head's test suites in the
            background when its branch-tip verdict is missing or stale (a cached
            result computed for an older commit), so the verdict is ready before
            the tests panel is opened or the merge gate runs (test_prefetch in
            config.toml). When false, tests run only on open / at merge;
            foreground runs and test_concurrency still apply. null/absent uses
            the built-in default (enabled).
        artifact_concurrency:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Max visual-artifact generations that run at once, across foreground
            (a user viewing a diff) and background (proactive pre-generation)
            work (artifact_concurrency in config.toml). Generations can be heavy
            (a full build per ref, RAM-hungry tooling like emulators), so this
            caps parallelism - lower it for memory-hungry generators. Foreground
            requests are served before queued background ones; a running
            generation is never preempted. 0 means unlimited (no cap);
            null/absent uses the built-in default.
        artifact_prefetch:
          type: boolean
          nullable: true
          description: >-
            Whether the daemon proactively pre-generates a head's artifacts in
            the background once its working tree settles, so a diff is ready
            before it is opened (artifact_prefetch in config.toml). When false,
            artifacts are generated only when a diff is viewed; foreground
            generation and artifact_concurrency still apply. null/absent uses
            the built-in default (enabled).
        default_pre_prompt:
          type: string
          description: Built-in default pre-prompt always prepended to agent prompts (read-only)
        review:
          # The raw [review] table for this config layer (absent when the layer
          # sets none). Edited in the Settings Review section; the scope tab
          # decides which file a save writes to.
          $ref: '#/components/schemas/ReviewConfig'
        resources:
          # The raw [resources] cgroup limits for this config layer (absent when
          # the layer sets none). Edited in the Settings Resource limits section;
          # the scope tab decides which file a save writes to.
          $ref: '#/components/schemas/ResourceLimits'

    ServiceStatus:
      type: object
      required: [name, script, host, state, restarts, max_restarts]
      description: Live status of one supervised service
      properties:
        name:
          type: string
        script:
          type: string
        host:
          type: boolean
        state:
          type: string
          enum: [up, restarting, failed, down, paused]
          description: up = running; restarting = backing off after an unexpected exit; failed = gave up after exhausting restarts; down = intentionally stopped; paused = not running because the project has no active agents (starts when one is spawned)
        restarts:
          type: integer
          description: Restarts performed so far
        max_restarts:
          type: integer
        pid:
          type: integer
          description: Process id while running, else 0
        message:
          type: string
          description: Human-readable detail for non-running states (exit reason / last output)

    ServiceStatusResponse:
      type: object
      required: [services]
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'

    ArtifactFile:
      type: object
      required: [name, change_type]
      properties:
        name:
          type: string
          description: File name relative to the artifact set
        change_type:
          type: string
          enum: [added, removed, modified, unchanged]
        left_url:
          type: string
          nullable: true
          description: URL of the file for the left version (null if absent on the left)
        right_url:
          type: string
          nullable: true
          description: URL of the file for the right version (null if absent on the right)
        tags:
          type: array
          nullable: true
          items:
            type: string
          description: >-
            Labels for this file, read from a sibling JSON sidecar
            (<file>.meta, {"tags": [...]}). A "category::value" tag is a
            scoped label - only one value per category survives. Drives the
            artifacts panel's tag badges and filter. Null/absent when the file
            has no tags.
        unverified:
          type: boolean
          nullable: true
          description: >-
            True only for a video file reported as "modified" whose verdict is a
            raw byte-hash comparison because ffmpeg was unavailable to verify it
            frame-by-frame - so the change may be spurious (e.g. only container
            metadata differs). Absent/false for images and for frame-verified
            video. The UI shows a caveat badge when set.
        size:
          type: integer
          format: int64
          nullable: true
          description: >-
            File size in bytes (head side preferred). Labels download-class
            tiles (an .apk, a .zip); may be absent for entries written before
            the field existed.
        change_ratio:
          type: number
          format: double
          nullable: true
          description: >-
            Fraction (0..1) of the media that differs between the two versions,
            for a "modified" file. For images it is the share of pixels whose
            RGBA differs; for video the share of frames whose content hash
            differs (per-frame granularity, since ffmpeg hashes whole frames).
            0 means pixel/frame-identical (such a file is reported "unchanged"
            instead), 1 a wholesale change (e.g. differing dimensions). Lets the
            UI apply a "% changed" threshold below which a change is treated as
            identical. Absent for added/removed/unchanged files and for video
            left byte-compared (see unverified).
        fps:
          type: number
          format: double
          nullable: true
          description: >-
            Frame rate of a video file, read from its sibling JSON sidecar
            (<file>.meta, {"fps": 60}). HTML5 video exposes no frame rate, so the
            viewer's frame-step buttons use it to size a single-frame step.
            Null/absent when the sidecar omits it, in which case the viewer
            assumes a sensible default. Only meaningful for video files.
        width:
          type: integer
          nullable: true
          description: >-
            Natural pixel width of the media, measured server-side at generation
            time (image header, or ffprobe for video) and cached in the entry's
            meta.json. Lets the grid lay out tiles without downloading every file
            to measure it, and avoids upscaling a low-resolution shot. Best-effort:
            null/absent when it could not be determined.
        height:
          type: integer
          nullable: true
          description: Natural pixel height of the media; see width. Null/absent when undetermined.
        dpi:
          type: number
          format: double
          nullable: true
          description: >-
            Pixel density (device-scale factor) the media was captured at, read
            from its sidecar (<file>.meta, {"dpi": 2}). The grid sizes a tile by
            the media's logical width (width / dpi) so a shot captured at 2x lays
            out the same as the same shot at 1x - only crisper. Null/absent → 1.

    ArtifactSet:
      type: object
      required: [name, status, changed, files]
      properties:
        name:
          type: string
          description: The configured artifact script name
        status:
          type: string
          enum: [ready, generating, error]
        changed:
          type: boolean
          description: Whether any file differs between the two versions
        error:
          type: string
          nullable: true
          description: >-
            Set only when the whole set failed (status "error") - i.e. both
            sides failed, or a side could not be loaded at all. When just one
            side fails while the other renders, status stays "ready" and the
            failure is reported in left_error / right_error instead.
        left_error:
          type: string
          nullable: true
          description: >-
            Error message from the LEFT (before) generation when that side
            failed but the RIGHT side still rendered, so the panel can show the
            available images alongside a warning. Null when the left side
            succeeded (or when the whole set failed - see error).
        right_error:
          type: string
          nullable: true
          description: As left_error, for the RIGHT (after) side.
        started_at:
          type: integer
          format: int64
          nullable: true
          description: >-
            Unix time (seconds) the earliest in-flight side started, so the UI
            can show how long it has been running. Only set while status is
            "generating".
        left_progress:
          type: string
          nullable: true
          description: >-
            Latest progress line of the in-flight LEFT (before) generation. Taken
            from `::hydra:progress::` marker lines the script emits, falling back
            to the latest stdout line until the first marker is seen. Only set
            while that side is generating.
        right_progress:
          type: string
          nullable: true
          description: As left_progress, for the RIGHT (after) generation.
        left_queued:
          type: integer
          nullable: true
          description: >-
            The LEFT (before) generation's 1-based place in the generation queue
            while it waits for a slot; absent or 0 once it is actually running.
            An entry is marked in-flight before it acquires a slot, so without
            this a generation queued behind other work looks identical to a
            running one - same "generating" status, same ticking started_at, same
            empty log.
        right_queued:
          type: integer
          nullable: true
          description: As left_queued, for the RIGHT (after) generation.
        left_log:
          type: array
          nullable: true
          description: >-
            Captured stdout+stderr lines of the in-flight LEFT (before)
            generation, surfaced as a live log. Only populated while that side is
            generating; once settled, fetch left_log_url instead.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        right_log:
          type: array
          nullable: true
          description: As left_log, for the RIGHT (after) generation.
          items:
            $ref: '#/components/schemas/ArtifactLogLine'
        left_log_url:
          type: string
          nullable: true
          description: >-
            URL to fetch the persisted build log of the LEFT (before) side once
            it has settled (ready or error), so the log can be reopened after
            generation finishes. Null while generating or if no log was captured.
        right_log_url:
          type: string
          nullable: true
          description: As left_log_url, for the RIGHT (after) side.
        pending_tags:
          type: array
          nullable: true
          description: >-
            Tags already known from a side that has settled while the other side
            is still generating, so the diff viewer's tag filter can appear
            before the whole set is ready (the "before" side often finishes
            first thanks to caching). Deduped and sorted, drawn from whichever
            side(s) have produced files so far. Only set while status is
            "generating"; once ready, tags are carried per file in files[].tags.
          items:
            type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactFile'

    ArtifactLogLine:
      type: object
      required: [text, stream]
      properties:
        text:
          type: string
          description: One captured output line (no trailing newline)
        stream:
          type: string
          enum: [stdout, stderr]
          description: Which stream the line came from; stderr is rendered in red

    ArtifactsResponse:
      type: object
      required: [scripts]
      properties:
        scripts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSet'

    # --- Terminal WebSocket (/ws/projects/{id}/agents/{id}/terminal) ----------
    #
    # A terminal-mode head's socket carries raw PTY bytes as binary frames and
    # these control events as text frames. Each member declares its own single
    # value for `type`, so a client can narrow on it directly.

    TerminalEvent:
      description: One server-to-client control event on a terminal-mode socket.
      oneOf:
        - $ref: '#/components/schemas/HeadStatusEvent'
        - $ref: '#/components/schemas/TerminalDataEvent'
        - $ref: '#/components/schemas/HeadDiffRefreshEvent'
        - $ref: '#/components/schemas/TerminalSizeEvent'
      discriminator:
        propertyName: type
        mapping:
          status: '#/components/schemas/HeadStatusEvent'
          data: '#/components/schemas/TerminalDataEvent'
          diff_refresh: '#/components/schemas/HeadDiffRefreshEvent'
          size: '#/components/schemas/TerminalSizeEvent'

    HeadStatusEvent:
      type: object
      description: >-
        The head's computed status changed. Sent on both sockets, so it belongs
        to both unions rather than being modelled twice.
      required: [type, status]
      properties:
        type:
          type: string
          enum: [status]
        status:
          $ref: '#/components/schemas/AgentStatus'

    TerminalDataEvent:
      type: object
      description: A chunk of PTY output, when it is relayed as text rather than binary.
      required: [type, data]
      properties:
        type:
          type: string
          enum: [data]
        data:
          type: string
          description: Base64 encoded binary data or plain string

    HeadDiffRefreshEvent:
      type: object
      description: >-
        The worktree changed; the diff viewer should re-fetch. Sent on both
        sockets, so it belongs to both unions rather than being modelled twice.
      required: [type, head_moved]
      properties:
        type:
          type: string
          enum: [diff_refresh]
        head_moved:
          type: boolean
          description: >-
            True when this refresh was triggered by a new commit (HEAD
            moved), as opposed to an uncommitted working-tree change. The
            diff viewer uses it to also re-snapshot per-commit artifacts
            (screenshots), which are memoized by commit SHA, while a plain
            working-tree change only re-fetches the diff text.

    TerminalSizeEvent:
      type: object
      description: >-
        The PTY's current window size, sent on attach right before the
        scrollback replay so the client can size its terminal to match. The
        replayed bytes carry cursor moves and wrapping computed for this
        width; rendering them at a different width corrupts the history.
      required: [type, cols, rows]
      properties:
        type:
          type: string
          enum: [size]
        cols:
          type: integer
        rows:
          type: integer

    # --- Chat WebSocket (the same /terminal socket, for a chat-mode head) -----
    #
    # A chat-mode head's socket carries no PTY bytes: every frame is text, and
    # every conversation frame carries Hydra's provider-neutral normalized
    # events (see internal/chat and docs/chat-mode.md). A provider's own payload
    # rides inside an event's `payload`, where the Raw panel can show it, but it
    # never determines the wire format.

    ChatEvent:
      type: object
      description: >-
        One durable normalized event. `seq` is per-head, monotonic, and the sole
        wire and cursor identity - provider object ids stay inside `payload`.
      required: [seq, type, timestamp]
      properties:
        seq:
          type: integer
          format: int64
          x-go-type: uint64
          description: Per-head sequence number; also the history cursor.
        source_id:
          type: string
          x-go-type-skip-optional-pointer: true
          description: >-
            Ingestion identity used to deduplicate. Re-reading a transcript
            window or re-observing a line appends nothing new.
        type:
          type: string
          description: >-
            The event kind, e.g. conversation_started, user_message,
            assistant_delta, assistant_message, reasoning_completed,
            reasoning_duration, tool_started, tool_completed, subagent_started,
            subagent_completed, plan_updated, commit_created, head_changed,
            notice, interaction_requested, messages_retracted, turn_started,
            turn_completed, turn_failed, turn_interrupted.
        timestamp:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          x-go-type: json.RawMessage
          x-go-type-skip-optional-pointer: true
          description: >-
            The event's fields, which vary by `type`. Deliberately open: the
            provider's own recorded entry rides here too, so the Raw panel can
            show what the provider actually sent.

