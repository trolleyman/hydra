## Hydra project configuration - .hydra/config.toml
##
## Hydra runs autonomous coding agents ("heads"), each on its own git branch in an
## isolated worktree and OS sandbox, supervised by a per-project daemon. This file
## configures those agents and the daemon: the default pre-prompt, the sandbox
## policy (what agents may read, write and reach over the network), the decision
## gate, per-agent ([claude], [gemini], ...) overrides, and the [artifacts.<name>],
## [previews.<name>], [services.<name>] and [tests.<name>] scripts run per project.
##
## Reading this file:
##   ##  lines are Hydra's own docs and defaults - rewritten on every save, so edit
##       the setting below each, not the ## text itself.
##   # key = value   is a commented-out default; delete the leading "# " to override it.
##   # your note     a single-# comment is yours and is preserved across saves.
## Most settings are also editable from the Settings screen in the web UI.

## extra instructions appended to every agent's system prompt. Layers combine:
## a user-config pre_prompt stays in force and a project's is appended after it.
pre_prompt = '''
- `rg` searches RECURSIVELY by default - `rg pat internal/` and `rg pat` already walk the tree, and there is no `-r` for it. In `rg`, `-r` is `--replace`: `rg -rn "pat" dir` silently rewrites every match to `n` and prints no line numbers, which looks like a search that found odd results rather than like a mistake. Reach for `--hidden`, `--no-ignore` or `-u` when the default is skipping files you want. (`-r`/`-R` for recursion is `grep`.)
- A single `sed`, `cat`, `head`, or numbered search already identifies its source and needs no separator. Between adjacent reads whose boundary may be ambiguous, print a typed constant marker such as `printf '%s\n' '--- [file] web/src/App.tsx ---'`. Use `[text]` for an exact ordinary heading and `[dir]` for a directory. Hydra consumes the marker into a compact ruled header while preserving its value exactly. Prefer `printf` to `echo`, and prefer a marker to adding numbers with `nl` or `cat -n`, so copied source stays clean.
- Use aube if it is available, otherwise npm. For one-off tools use `aubx <tool>` (aube's npx, short for `aube exec`) when on aube, else `npx <tool>`. Run standalone TypeScript scripts (web/scripts, web/e2e) with `node` directly - Node strips the types; aube is a package manager only and cannot run them.
- While iterating, run only the tests that cover the changed package, file, or behavior. For example, use `go test ./internal/tests -run TestName` or `cd web && aube exec vitest run src/lib/example.test.ts` instead of a full repository suite. Run repository-wide checks once after the complete change, not after every commit. Run `mage build` once after the implementation is complete, before the final commit and handoff; repeat it earlier only at a meaningful integration checkpoint.
- Run `mage tidy` before committing Go changes and fix any warnings it reports
- After the complete web change, run `cd web && aube run lint` (`npm run lint` off aube) once and fix the errors AND warnings you introduced. It runs `tsc -b` before eslint, so it typechecks too - eslint alone does NOT, and a type error will otherwise only surface at `mage build`.
- After the complete Go change, run `go test ./...` once and make sure it passes. During iteration and between commits, run only the relevant package or named test.
- When writing docs, can you ideally not refer to how things _were_, just refer to how they _are_, especially after a change. That way the docs reflect present reality.
- When making changes, also update the docs to reflect those changes.
- When making git commits - have the message be not just 1 line, unless it's a basic change. Explain a bit more about what the change is
- Verify web UI changes end-to-end (real rendered app, console + DOM, not just tests) by booting the simulation server and driving it with Playwright:
  - `cd web && aube run build`, then from the repo root `HYDRA_API_ADDR=localhost:<random high port> go run ./ server --simulation`. The go binary embeds web/dist at compile time, so restart it after every frontend rebuild. Simulation serves mock data from internal/http/simulation.go plus all four WS endpoints (events/terminal/tests/artifacts).
  - Useful pages: /project/sim-project/agent/agent-1 (8-file diff, largest, incl. a >1000-changed-lines hidden "Load diff" file), agent-2 (small diff incl. a plaintext .txt file, tests panel data), agent-md (markdown / running-tests states).
  - Playwright scripts MUST live under web/ (node resolves node_modules from the script's dir) - write throwaway drivers to web/scripts/ and delete them before committing. Install browsers from web/ with `cd web && aubx playwright install chromium` (playwright is a devDependency, so this runs the pinned local version).
  - The agent page scrolls in an inner pane `[data-main-scroll]`, not the window - scroll via pane.scrollTop. Diff file cards: `div.border.rounded-lg.mb-4`; lazily-unmounted bodies contain `[data-lazy-placeholder]`; code rows match `span.font-mono.text-xs.leading-5` (~4 spans per diff line).
  - Capture page.on('console') and page.on('pageerror') - console cleanliness is often the thing being verified. Known pre-existing sim-server 404 noise to ignore: /uploads/projects/*/blob, /folder-picker/available.
  - A screenshot you intend to SHOW the user: take it with `deviceScaleFactor: 2` on the browser context and save it as `<name>@2x.png`. The chat lays an image out at its logical size (pixels / the @Nx in its name), so a 2x shot is the same size as a 1x one but stays sharp on a HiDPI display. Measure, don't eyeball: an image is only crisp if its rendered content box is exactly natural px / density (getComputedStyle width vs naturalWidth) - a fractional ratio means it is being resampled.
  - For light + dark app captures, create a fresh context per theme and call `seedScreenshotTheme` from `web/scripts/lib/screenshotReady.ts` before navigation, then `settleScreenshot(page)` immediately before capture. Never toggle the `dark` class and immediately screenshot a live page: `transition-colors` can produce a mixed, half-transition frame.
  - Show the user a relevant light + dark capture in chat for every visually reviewable UI change. Use the real simulation app when behavior, surrounding layout or state matters. For an isolated styling treatment, use `cd web && node scripts/capture-theme-snippet.ts --html <throwaway-file> --output /tmp/<name>` after the production build, then delete the throwaway HTML; see `docs/screenshots.md`.'''

## custom project icon shown in the web UI's project switcher and dropdown: an emoji, a lucide-react icon name (e.g. "Rocket"), or an image path/URL ending in .png/.svg/.ico/.jpg. Empty = the default folder icon.
icon = "web/public/icon.png"

## message typed into an agent that was working when the daemon restarted, so it resumes its task instead of idling (default "Continue"; "" disables).
# resume_prompt = "Continue"

## max visual-artifact generations run at once, across foreground (viewing a diff) and background (proactive) work; lower it for RAM-hungry generators, or 0 for unlimited (default 2).
artifact_concurrency = 1

## pre-generate a head's artifacts in the background once it settles, so a diff is ready before you open it; set false to generate only when viewing - foreground generation and the concurrency cap still apply (default true).
artifact_prefetch = false

## max test-runner generations run at once; lower it for heavy suites, or 0 for unlimited (default 1).
test_concurrency = 1

## re-run a head's test suites in the background when its branch-tip verdict is missing or stale, so it's ready before you open the panel; set false to run only on open / at merge - foreground runs and the concurrency cap still apply (default true).
test_prefetch = false

## inclusive "min-max" TCP port range that the live server previews ([previews.<name>]) allocate their listeners from; a fixed range keeps firewall rules simple, and busy ports are skipped (default 26601-26699).
# preview_ports = "26601-26699"

[sandbox]
# ~/.local/share/go/pkg/sumdb is GOPATH/pkg/sumdb (GOPATH stays ~/.local/share/go
# even though GOMODCACHE is redirected to ~/.cache/go); `go`/`go tool` writes the
# checksum-db tree head there when fetching a new module, so without it fetching a
# tool dep (e.g. gotestsum) fails with a read-only-filesystem error on sum.golang.org.
# The web build installs deps and runs `generate-openapi` via `npx` (or aube), so
# their caches/stores must be writable: ~/.npm for npm/npx, and ~/.local/share/aube
# for aube's global content-addressed store. Hence those two entries below.
## extra paths made writable in the sandbox, unioned on top of the built-in
## defaults below AND across config layers (this list in ~/.config/hydra/
## config.toml applies to every project; a project's own list adds to it).
## A path can be ~ (HOME), absolute, or a $VAR. Secrets are hidden separately
## via masked_paths, so nothing here holds credentials.
## Built-in defaults, always writable (broad caches + toolchain + agent state):
##     ~/.cache, ~/.local/share/mise, ~/.local/share/hydra/logs, ~/.claude,
##     ~/.claude.json, ~/.gemini, ~/.copilot, ~/.codex
## Common per-project additions (NOT writable by default - add the ones you use
## here, or to cow_paths for per-head copy-on-write isolation):
##     ~/.cargo - Rust registry + toolchain cache
##     ~/.gradle - Gradle / Android / Kotlin build cache (cow_paths gives per-head isolation)
##     ~/.npm - Node / npm (npx) package cache
##     ~/.local/share/kotlin - Kotlin compiler cache
##     ~/.local/share/JetBrains - JetBrains toolbox
##     ~/.local/state - XDG state (some tools persist logs/history here)
writable_paths = ["~/.cache/go", "~/.npm", "~/.cache/goimports", "~/.magefile", "~/.local/share/go/pkg/sumdb", "~/.local/share/aube"]

## extra paths hidden in the sandbox (added to the built-in defaults).
# masked_paths = ["~/.ssh", "~/.aws", "~/.azure", "~/.gnupg", "~/.docker", "~/.kube", "~/.password-store", "~/.config", "~/.netrc", "~/.git-credentials", "~/.npmrc", "~/.pypirc", "~/.zsh_history", "~/.bash_history", "~/.sh_history", "~/.config/mise/config.local.toml", "~/.dotfiles/mise/config.local.toml"]

# ~/.config/go holds `go env -w` settings (GOMODCACHE=~/.cache/go/pkg/mod,
# GOCACHE=~/.cache/go/build, GOPATH=~/.local/share/go); ~/.config is masked by
# default, so re-expose it or the sandboxed `go` falls back to ~/go/pkg/mod (not writable).
## paths re-exposed read-only after a masked parent (added to the built-in defaults).
restore_ro = ["~/.config/go"]

## paths mounted copy-on-write (read source, writes kept per-head): worktree-relative (mirrored from project root) or home/absolute like ~/.gradle (overlaid in place, supersedes its writable bind).
# cow_paths = []

## shell script run in the sandbox before every agent launch - spawn and resume, so it must be idempotent (e.g. mise trust). To set environment variables for the agent, append `KEY=value` lines to the file at $HYDRA_ENV (e.g. `echo "GRADLE_USER_HOME=/tmp/gradle-iso" >> "$HYDRA_ENV"`); each is exported into the agent and every command it runs, overriding any inherited value (the GitHub Actions $GITHUB_ENV model). Those same vars are also injected into the head's sandboxed bash shells (the terminal '+' tabs) so a shell shares the agent's environment - the script is not re-run there; the non-sandboxed 'Regular shell' is left out. It also gets the HYDRA_* head-context vars (HYDRA_HEAD_ID, HYDRA_WORKTREE, ...).
# pre_spawn_script = ""

## shell script run in a sandbox when a head ends, before its worktree is removed - gets HYDRA_* + HYDRA_END_STATE; e.g. release a claimed resource.
# pre_exit_script = ""

[sandbox.network]
## egress posture: "off" (no network), "unrestricted" (network, no host filtering), "advisory" (proxy-only host filtering - every honest client is filtered, but escapable), or "hard" (inescapable pasta+nft netns, failing closed - no network - when the boundary can't be built; "on" is a synonym for "hard"). Default "hard". Supersedes the legacy enabled/filter_enabled booleans.
mode = "hard"

## LEGACY (use mode): allow outbound network access from the sandbox. Honoured only when mode is unset.
# enabled = true

## LEGACY (use mode): enforce the allowed_hosts list (deny-by-default egress). Honoured only when mode is unset. Unset = on when allowed_hosts is non-empty; true = only allowed_hosts reachable; false = allow every host.
# filter_enabled = false

## extra outbound hosts (exact host or *.suffix) allowed when filtering is on,
## unioned on top of the built-in default allow-list below. Leaving this empty
## does NOT disable the defaults - to remove one, list it in blocked_hosts.
## Built-in defaults, always allowed regardless of agent (package registries,
## language toolchains, git hosts):
##     registry.npmjs.org, *.npmjs.org, *.yarnpkg.com, pypi.org, *.pypi.org,
##     files.pythonhosted.org, *.golang.org, proxy.golang.org,
##     sum.golang.org, crates.io, *.crates.io, static.crates.io,
##     rubygems.org, *.rubygems.org, github.com, *.github.com,
##     *.githubusercontent.com, codeload.github.com, gitlab.com,
##     *.gitlab.com, bitbucket.org, *.bitbucket.org
## Plus the AI-provider hosts for the agent's own type (a bash or unknown agent
## gets the union of every provider's hosts):
##     claude: *.anthropic.com, claude.ai, *.claude.ai, *.claudeusercontent.com,
##       platform.claude.com, http-intake.logs.us5.datadoghq.com
##     codex: api.openai.com, *.openai.com, chatgpt.com, *.chatgpt.com,
##       *.oaiusercontent.com
##     gemini: *.googleapis.com
##     copilot: *.githubcopilot.com
allowed_hosts = ["cdn.playwright.dev", "storage.googleapis.com", "code.claude.com", "browser-intake-us5-datadoghq.com", "fonts.googleapis.com", "fonts.gstatic.com", "aube.jdx.dev", "npm.jsr.io", "api.osv.dev", "git-scm.com", "dot.net", "builds.dotnet.microsoft.com", "download.visualstudio.microsoft.com"]

## outbound hosts (exact host or *.suffix) to deny even when otherwise allowed - overrides both allowed_hosts and the built-in defaults, so you can subtract a default host without redefining the list.
# blocked_hosts = []

## host-loopback TCP ports reachable from the sandbox even under mode = "hard" (whose netns otherwise cuts off the host's 127.0.0.1) - for host-local daemons that hardcode loopback, e.g. adb's server: [5037]. No effect in other modes (they share the host loopback already).
# allowed_loopback_ports = []

[policy]
## enable the decision-capable gate that can deny tool calls (non-allow-listed MCP, credential reads, policy-file writes, global installs) even under skip-permissions (default true).
# gate_enabled = true

## how much of the repo's shared .git the head may write: "readonly" (default) locks the whole .git read-only so commits go through the mcp__hydra__git_commit tool (anti-rogue); "off" leaves it writable. See docs/git-isolation.md.
# git_isolation = "readonly"

## MCP server names the agent may use (whole-server grant covers all its tools); any other server is stripped before launch and denied at runtime (default none).
# mcp_allowed = []

## individual MCP tools ("<server>__<tool>") allowed even when the whole server is not; the server is kept (spawned) so those tools work, other tools park for approval (default none).
# mcp_tools_allowed = []

## MCP server names refused outright: stripped before launch and every call DENIED at runtime (never parked for approval). Block overrides allow; since the allow-lists union across config layers, this is how a project or config.local.toml removes a server a broader layer granted (default none).
# mcp_blocked = []

## individual MCP tools ("<server>__<tool>") denied outright even when their server is allowed. Block overrides allow (default none).
# mcp_tools_blocked = []

## auto-allow MCP tools the read/write classifier deems read-only (parking only writes/unknown). Best-effort heuristic - off by default.
# mcp_auto_allow_read = false

## make the allow-list the ONLY source of MCP servers: Hydra renders the allow-listed servers (plus its own control server) into a per-head config and launches Claude with --strict-mcp-config, so the host's ~/.claude.json and a branch's .mcp.json are ignored outright rather than filtered (filtering rides a bind mount the host can silently detach). Costs the claude.ai account connectors - Gmail/Calendar/Drive - which cannot be re-declared; turn it off for an agent that needs them. On by default.
# strict_mcp = true

## allow this head to send attributed messages to other live heads in the same project. Discovery stays available when this is off. Off by default.
agent_messaging = true

## extra tool names to treat as safe (allowed without approval), extending the gate's built-in set. The gate fails closed on any tool it doesn't recognize (not a known built-in and no mcp__ prefix), parking it for approval; register a legitimate tool here to stop that. The default value below is the built-in set the gate already recognizes - add names to it, don't remove.
# known_tools = ["Agent", "Artifact", "AskUserQuestion", "Bash", "BashOutput", "CronCreate", "CronDelete", "CronList", "DesignSync", "Edit", "EnterPlanMode", "EnterWorktree", "ExitPlanMode", "ExitWorktree", "Glob", "Grep", "KillBash", "KillShell", "LS", "LSP", "Monitor", "MultiEdit", "NotebookEdit", "NotebookRead", "PushNotification", "Read", "RemoteTrigger", "ReportFindings", "ScheduleWakeup", "SendMessage", "Skill", "SlashCommand", "Task", "TaskCreate", "TaskGet", "TaskList", "TaskOutput", "TaskStop", "TaskUpdate", "TodoWrite", "ToolSearch", "WebFetch", "WebSearch", "Workflow", "Write", "apply_patch", "create_goal", "exec", "exec_command", "followup_task", "get_goal", "interrupt_agent", "list_agents", "list_mcp_resource_templates", "list_mcp_resources", "read_mcp_resource", "request_plugin_install", "request_user_input", "send_message", "spawn_agent", "tool_search", "update_goal", "update_plan", "view_image", "wait", "wait_agent", "write_stdin"]

## Claude-specific overrides: any of the settings above, applied only to claude agents.
# [claude]
## enable Claude Code's fullscreen (alternate-screen) rendering - flicker-free, but it takes over the terminal and captures the mouse; off (the default) keeps this terminal's native scrollbar and select-to-copy.
# fullscreen = false

## Gemini-specific overrides: any of the settings above, applied only to gemini agents.
# [gemini]

## Copilot-specific overrides: any of the settings above, applied only to copilot agents.
# [copilot]

## Codex-specific overrides: any of the settings above, applied only to codex agents.
[codex]
pre_prompt = '''
- Do not use the Sites skills or Sites connector for Hydra web UI changes. This repository is not a Sites-managed project and has no `.openai/hosting.json`; use Hydra's production simulation app and Playwright workflow above for UI implementation and verification.
- Do not use Codex's browser-control skill for Hydra web UI verification. It is not useful for this repository's local simulation workflow; use the project-local Playwright workflow above directly.'''

## [artifacts.<name>]: per-project scripts that render visual artifacts (e.g.
## screenshots) of a checkout. The diff viewer runs each against both sides of a
## comparison and shows the outputs that differ. The <name> table key is the unique
## label, also used as the cache directory. Fields:
##   script       shell script run via `bash -c` in the checkout directory (required).
##                Write it as a multi-line ''' block - it is a script, not a one-liner:
##                each step on its own line, comments where a step needs explaining.
##   timeout_sec  max seconds the command may run (0 = built-in default).
##   unsafe_host  run on the host with NO sandbox - full access to your machine and
##                credentials; only for audited, self-contained commands (default false).
##   clean_ignored  also delete git-ignored files (e.g. node_modules) before each run -
##                a pristine checkout (git clean -fdx) instead of the default that keeps
##                dependency/build caches warm (-fd). Slower; set true only if stale
##                ignored output can leak between commits (default false).
##   auto_run     "always" (default), "settled" (wait while agent works), or "never"
##                (Refresh only). Cached artifacts still display in every mode.
##   strict       run the command under `set -eo pipefail` so a failing step aborts
##                and propagates instead of being swallowed (default true; set false
##                to run the command exactly as written).
##   enabled      set false to skip this script in the diff viewer (default true).
## A live, clickable preview of the app is a [previews.<name>] entry, not an
## artifact - see that section below. (The old spelling for one, an artifact with
## type = "server", still parses and is moved to [previews.<name>] on the next save.)
## Formats: .png, .jpg and .gif are diffed pixel-by-pixel; .webm video is diffed
## frame-by-frame when ffmpeg is installed (otherwise by byte hash). Other types
## (.webp .avif .svg .bmp .pdf) are compared by byte hash. Video is .webm ONLY, and
## should be LOSSLESS (e.g. ffmpeg ... -c:v libvpx-vp9 -lossless 1): the frame check
## compares decoded pixels, so a lossy encode of identical frames still reads as
## "modified".
## The command is given: HYDRA_ARTIFACT_OUTPUT (directory to write images into),
## HYDRA_ARTIFACT_SOURCE (the checkout dir), HYDRA_ARTIFACT_REF (the resolved ref).
## Streaming: after writing a file (and its .meta sidecar) the command may print
## ::hydra:artifact:: <path> on stdout (path relative to HYDRA_ARTIFACT_OUTPUT, e.g.
## echo "::hydra:artifact:: home-dark.png"). Hydra then scans and diffs just that file
## and streams the tile to the diff viewer immediately, so images trickle in as they
## render instead of all appearing when the command exits. It is optional - emit no
## markers and every output is still collected by the final scan on exit. Emit the
## marker only once the file is fully written. (Print ::hydra:progress:: <text> to set
## the live progress header shown while the command runs.)
## Tags: alongside an image foo.png the command may write a JSON sidecar foo.png.meta
## like {"tags": ["theme::dark", "viewport::phone"]}. The diff viewer shows these as
## labels and offers a filter. A "category::value" tag is a scoped label: only one
## value per category is kept (the last one wins); plain tags are free-form.
## The sidecar may also carry an optional dpi - the device-scale factor the shot was
## captured at, e.g. {"tags": [...], "dpi": 2} - so the grid sizes a tile by its
## logical width (pixels / dpi): a 2x shot lays out like a 1x one, only sharper.
## For a video, an optional fps (e.g. {"fps": 60}) sets the frame rate the diff
## viewer's frame-step buttons use (HTML5 video exposes no frame rate of its own).
## Layering: [artifacts.<name>] entries merge by name across config layers (user ->
## project -> config.local.toml) - set fields patch the same-named inherited entry,
## new names append. (The legacy [[artifacts]] array syntax still parses, but a file
## using it replaces the inherited list wholesale.)
[artifacts.screenshots]
# Diff-viewer artifact generator: renders Hydra's own web UI to
# PNGs so visual changes show up side-by-side in the diff viewer. The script
# builds the checkout's frontend, boots `hydra server --simulation` and
# screenshots several pages (home, the repository browser, agent diff views).
# It also records the repository view's loading spinner to a lossless,
# byte-deterministic .webm (project-local ffmpeg-static, libvpx-vp9 -lossless 1
# in bitexact mode) so the video diff viewer is exercised too - see the [artifacts.<name>]
# docs above on why video must be lossless. Building Go + the frontend is slow, so
# allow a generous timeout (results are cached per resolved ref).
script = '''
cd web

# aube when it is on PATH, npm otherwise - the lockfile is shared.
if command -v aube >/dev/null 2>&1; then
  aube install
else
  npm install
fi

node scripts/screenshots/take-screenshots.ts
'''
timeout_sec = 900
auto_run = "settled"

## [previews.<name>]: per-project scripts that boot a live, clickable preview of
## the app at a checkout. Each appears in the Previews row on the agent page; Hydra
## proxies a dedicated port to it, spawning the server when its link is first
## opened, keeping it warm while requests flow, and tearing it down once idle (the
## next visit respawns it). The <name> table key is the unique label. Fields:
##   script       shell script run via `bash -c` in the checkout directory (required).
##                It must build/boot a server that listens on $HYDRA_PREVIEW_ADDR and
##                stay in the foreground. Write it as a multi-line ''' block - it is a
##                script, not a one-liner: each step on its own line.
##   unsafe_host  run on the host with NO sandbox - full access to your machine and
##                credentials. Worse here than for an artifact: a preview runs the
##                previewed ref's code as a long-lived resident process (default false).
##   strict       run the command under `set -eo pipefail` so a failing build step
##                aborts the spawn instead of serving a half-built tree (default true).
##   enabled      set false to hide this preview from the agent page (default true).
##   idle_timeout_sec   teardown after this long with zero in-flight requests; open
##                WebSocket/long-poll connections count as in-flight, so a live app tab
##                keeps its preview running (0 = default 300).
##   ready_timeout_sec  max seconds from spawn to ready - builds included (0 = default
##                900). Ready = the first successful dial of the port, or an explicit
##                ::hydra:server:ready:: line on stdout, whichever comes first.
## The command is given: HYDRA_PREVIEW_PORT (the port to listen on), HYDRA_PREVIEW_ADDR
## (the full host:port to bind - 0.0.0.0:PORT under network mode hard, else
## 127.0.0.1:PORT; bind THIS, not a hardcoded 127.0.0.1, or hard mode 502s) and
## HYDRA_PREVIEW_SOURCE (the checkout dir). Print ::hydra:progress:: <text> to set the
## headline shown while it boots.
## Which ports the proxy allocates from is preview_ports, above.
## Layering: [previews.<name>] entries merge by name across config layers (user ->
## project -> config.local.toml) - set fields patch the same-named inherited entry,
## new names append.
## Previews used to be written as [artifacts.<name>] with type = "server". That still
## parses - such an entry is read as a preview and rewritten here on the next save.
[previews.demo]
# Live preview: builds the checkout's frontend and boots the simulation server
# (mock data, no daemon) on the port Hydra hands it, so a head's UI changes can
# be clicked through at a real rendered app via the Previews row on the agent
# page. Hydra proxies a dedicated port to it, shows the build log while it
# starts, and tears it down when idle; the first visit after that transparently
# respawns it. The frontend build dominates spawn time, hence the generous ready
# timeout.
script = '''
cd web

if command -v aube >/dev/null 2>&1; then
  aube install
else
  npm install
fi

# --mode development builds the frontend unminified with sourcemaps (see the
# isDev switch in web/vite.config.ts), so an error in the previewed app gives a
# readable stack trace instead of minified chunk soup. The preview exists to
# inspect and debug UI changes; readable beats small here.
npm run build -- --mode development

# Bind HYDRA_PREVIEW_ADDR, not a hardcoded 127.0.0.1: under network mode hard
# the proxy reaches the server from outside its netns, so it must listen on
# 0.0.0.0 there.
cd ..
HYDRA_API_ADDR="$HYDRA_PREVIEW_ADDR" go run ./ server --simulation
'''
ready_timeout_sec = 900

## [services.<name>]: per-project long-running scripts the daemon supervises while
## the project is registered. Each is started on daemon boot (and when the project
## is added), restarted with capped backoff if it exits unexpectedly, and
## process-group-killed on daemon shutdown, project removal, or a config save.
## The <name> table key is the unique label shown in the UI and logs. Fields:
##   script        shell script run via `bash -c` from the project root (required).
##   host          run on the host with NO sandbox - full machine/credential access;
##                 needed for host devices the sandbox hides, e.g. /dev/kvm (default false).
##   max_restarts  relaunch cap after an unexpected exit (default 3; 0 = never).
##   strict        run the command under `set -eo pipefail` so a failed startup step
##                 surfaces as a crash instead of a healthy process (default true).
##   enabled       set false to stop the daemon supervising this service (default true).
## Layering: [services.<name>] entries merge by name across config layers (user ->
## project -> config.local.toml) - set fields patch the same-named inherited entry,
## new names append. (The legacy [[services]] array syntax still parses, but a file
## using it replaces the inherited list wholesale.)
# [services.emu-pool]
# script = '''
# scripts/emu-pool.sh up 3 --foreground
# '''
# host = true
# max_restarts = 3

## [tests.<name>]: per-project test-runner scripts. Hydra runs each against a
## head's branch and parses the report into a pass/fail verdict that gates the
## merge button (failing/errored soft-block merge; force always available). The
## <name> table key is the unique label, also used as the cache directory. Fields:
##   script       shell script run via `bash -c` in the checkout directory (required).
##   timeout_sec  max seconds the command may run (0 = built-in default).
##   unsafe_host  run on the host with NO sandbox - runs the diffed ref's test code;
##                only for trusted refs (default false).
##   clean_ignored  also delete git-ignored files before each run (default false).
##   auto_run     "always" (default), "settled" (wait while agent works), or "never"
##                (Refresh only). Cached verdicts still display in every mode.
##   strict       run the command under `set -eo pipefail` (default true). Note: a
##                runner exiting non-zero because tests FAILED is a valid verdict,
##                not a strict abort - strict only governs the shell pipeline.
##   enabled      set false to skip this runner (default true).
##   type         "junit" (default) reads report files after exit; "stdout" parses
##                ::hydra:test:*:: markers live from stdout (see streaming note below).
## The command writes a report into $HYDRA_TEST_OUTPUT: JUnit XML (*.xml - go test
## via gotestsum, pytest, jest/vitest, cargo-nextest, ...) or a Hydra-native *.json
## ({total,passed,failed,skipped,duration_ms,cases:[{name,status,duration_ms,message}]}).
## Every *.xml / *.json in the dir is parsed and the cases are merged, so one
## command may emit several reports (e.g. a test report plus a lint report).
## If it writes no report, the exit code alone becomes a red/green verdict.
## Warnings: a case with status "warning" (Hydra JSON), or a JUnit <failure
## type="warning">, is a non-failing diagnostic - it shows as an amber ⚠ N on the
## long verdict chip (agent header / tests panel) but never fails the run or gates
## the merge (lint errors stay failures and do gate). ESLint 9's junit formatters
## don't tag severity, so feed lint via `-f json` converted to a Hydra-JSON report
## (severity 2 → status "failed", severity 1 → "warning").
## It is also given HYDRA_TEST_SOURCE (the checkout dir) and HYDRA_TEST_REF (the
## resolved ref).
## Streaming (type = "stdout"): instead of a report file, print one marker per line
## and Hydra counts them live (into the panel and the sidebar chip):
##   ::hydra:test:total:: 4556                                  (optional denominator)
##   ::hydra:test:pass:: internal/artifacts › TestGenerateAndCache
##   ::hydra:test:fail:: auth/rotation.test.ts:48:24 › grace window | expected 3 got 2
##   ::hydra:test:warn:: web/src/x.ts:12:5 › no-console | Unexpected console statement
##   ::hydra:test:skip:: heads/resume_test.go › TestResumeOnBoot | needs daemon
##   ::hydra:test:pass:38:: internal/artifacts › TestFast       (38 = duration in ms)
## Print ::hydra:progress:: <text> for an explicit phase headline; ordinary stdout
## stays in the live log but is not used as compact status for streaming runners.
## The token before the first › is the location (path[:line[:col]] or dotted class),
## middle › tokens are scope levels, the last is the test name, text after | is the
## message. A verb takes an optional :<ms> duration suffix, giving a streamed case
## the timing a JUnit report carries in its `time` attribute; it rides on the verb
## (a closed set) so a test name can never be mistaken for it, and omitting it stays
## valid. A marker is one line; in the message an escape sequence expands -
## backslash-n to a newline, backslash-t to a tab, backslash-r to a carriage return
## (so a multi-line stack trace fits on the one line) - and a doubled backslash
## becomes one literal backslash. Any other escape is left as-is.
## Layering: [tests.<name>] entries merge by name across config layers (user ->
## project -> config.local.toml) - set fields patch the same-named inherited entry,
## new names append. E.g. config.local.toml can disable one runner with just
##   [tests.lint]
##   enabled = false
## without restating its command. (The legacy [[tests]] array syntax still parses,
## but a file using it replaces the inherited list wholesale.)
[tests.go]
# Go test suite (type = "stdout": streams per-case results into the panel live via
# ::hydra:test:*:: markers). `go test -json ./...` is piped through
# scripts/gotest-markers, which turns each test's JSON event into a marker
# (package import path as the location - Hydra strips the go.mod prefix - subtests
# as scope) and passes the `ok pkg` / `FAIL pkg` summary lines through to the
# build log. Hydra reuses the previous run's case count as the next run's progress
# denominator, avoiding a separate discovery build.
# No global/mise install needed - it builds from the module cache wherever `go`
# works. The whole module is slow, so allow a generous timeout. (web/dist is kept
# present in every checkout via a committed web/dist/.gitkeep, so the //go:embed
# all:dist in web/embed.go compiles without building the frontend.)
# Once the tests pass, errtrace-report (read-only errtrace -l - safe against a
# head's live worktree) emits ⚠ warn markers for what `mage tidy` would still
# change - unwrapped error returns and unused //errtrace:skip directives -
# informational only; they never gate the merge.
script = '''
# Limit package and runtime parallelism so one background check cannot consume
# the whole machine. Each JSON event becomes a ::hydra:test:*:: marker; Hydra
# uses the previous run's total as its progress denominator.
echo "::hydra:progress:: Running Go tests"
GOMAXPROCS=2 go test -p 2 -timeout=3m -json ./... | go run ./scripts/gotest-markers

# Informational only - warn markers for what `mage tidy` would still change.
echo "::hydra:progress:: Checking errtrace"
go run ./scripts/errtrace-report
'''
timeout_sec = 900
auto_run = "settled"
type = "stdout"

[tests.web]
# Frontend vitest suite (type = "stdout": streams per-spec results into the panel
# live via ::hydra:test:*:: markers) using the scripts/hydra-reporter.ts vitest
# reporter — it also declares a ::hydra:test:total:: denominator as modules are
# collected and echoes per-file ok/FAIL lines into the build log — plus ESLint and
# TypeScript passes whose findings surface on the same verdict:
# eslint-report.ts emits fail markers for errors (which gate the merge like a
# failing test) and ⚠ warn markers for warnings (informational only), and
# tsc-report.ts does the same for type errors. Both run only once the specs pass
# (the merge is already blocked when they don't).
# The tsc pass matters: typechecking used to gate NOTHING — `npm run lint` was
# eslint alone and this runner never compiled — so a head could go green with a
# frontend that does not build. Only `mage build` caught it, and nothing
# automated runs that.
script = '''
cd web

# aube when it is on PATH, npm otherwise; PX is the matching one-off runner.
if command -v aube >/dev/null 2>&1; then
  PM=aube PX=aubx
else
  PM=npm PX=npx
fi

echo "::hydra:progress:: Installing web dependencies"
if ! $PM install; then
  # Warm runner slots retain node_modules between commits. If aube's freshness
  # state outlives one of its linked package directories, a normal install can
  # fail while creating bins (for example tsc -> a missing TypeScript package).
  # Force materialisation once; a real resolution/download failure still exits.
  if [ "$PM" = aube ]; then
    echo "::hydra:progress:: Repairing web dependency links"
    aube install --force
  else
    exit 1
  fi
fi

# Specs first - the merge is already blocked when they fail, so the lint and
# typecheck passes below only run once they pass.
echo "::hydra:progress:: Running web tests"
$PX vitest run --maxWorkers=2 --reporter=./scripts/hydra-reporter.ts

echo "::hydra:progress:: Running ESLint"
node scripts/eslint-report.ts
echo "::hydra:progress:: Typechecking web"
node scripts/tsc-report.ts
'''
timeout_sec = 600
auto_run = "settled"
type = "stdout"

[tests.e2e]
# Playwright smoke suite (web/e2e), which drives the REAL built UI against the
# simulation server - the only coverage that catches a selector or flow breaking
# in the rendered app rather than in jsdom. It was left out when this gate was
# first written, so 13 of its specs rotted unnoticed for weeks against UI changes
# that were themselves correct.
#
# Its webServer step (web/e2e/serve.ts) builds a hydra binary from the checkout
# and runs it with --simulation, so web/dist must exist first - hence the
# `npm run build`. `playwright install chromium` is a no-op once the browser is
# in ~/.cache/ms-playwright (writable and shared); a cold machine downloads it
# from cdn.playwright.dev, which is allow-listed above.
#
# Two things make it safe to run on a shared machine:
#   E2E_PORT   picked free at run time. The config's default is a FIXED port, and
#              two heads testing at once would collide on it.
#   CI=1       turns off playwright's reuseExistingServer, so a stale or
#              concurrent server on that port can never be adopted - that would
#              silently test someone else's build. (It also enables one retry,
#              which is the right call for browser-driven specs.)
#
# type = "stdout": e2e/hydra-reporter.ts emits ::hydra:test:*:: markers per spec
# (with its duration), so counts tick in the panel live instead of appearing all
# at once at exit. That matters most here: this is the slowest runner, and a run
# killed by the timeout used to report NOTHING - playwright's junit reporter only
# writes its file at the end, so a timeout read as a bare red exit code. Streamed
# cases are kept as they arrive, so a partial run still shows what passed.
script = '''
cd web

if command -v aube >/dev/null 2>&1; then
  PM=aube PX=aubx
else
  PM=npm PX=npx
fi

echo "::hydra:progress:: Installing e2e dependencies"
if ! $PM install; then
  # See tests.web: cached aube state can survive a missing package directory in
  # a warm test slot. One forced install repairs the materialised link tree.
  if [ "$PM" = aube ]; then
    echo "::hydra:progress:: Repairing e2e dependency links"
    aube install --force
  else
    exit 1
  fi
fi

# serve.ts builds a hydra binary and runs it with --simulation, so web/dist must
# exist first.
echo "::hydra:progress:: Building e2e app"
$PM run build

# A no-op once the browser is in the shared ~/.cache/ms-playwright.
echo "::hydra:progress:: Preparing Chromium"
$PX playwright install chromium

# Pick a free port at run time: the config's default is FIXED, and two heads
# testing at once would collide on it.
E2E_PORT="$(node -e "const s=require('net').createServer();s.listen(0,'127.0.0.1',()=>{console.log(s.address().port);s.close()})")"
export E2E_PORT

# CI=1 turns off playwright's reuseExistingServer, so a stale or concurrent
# server on that port can never be adopted (it also enables one retry).
echo "::hydra:progress:: Running browser tests"
CI=1 $PX playwright test --reporter=./e2e/hydra-reporter.ts
'''
timeout_sec = 900
auto_run = "never"
type = "stdout"

## [review] configures how Hydra talks to a forge (GitHub/GitLab) and the
## defaults for the Create MR dialog. There is no mode switch - the head<->MR
## link is per-head. Personal overrides belong in .hydra/config.local.toml;
## never put a token here (host-side gh/glab creds or the 0600 secrets file).
# [review]
# provider = "auto"            # auto | github | gitlab (auto detects from the remote URL)
# publisher = "forge"          # forge | graphite (Graphite uses GitHub underneath)
# remote = "origin"
# auth = "cli"                 # cli (shell out to gh/glab) | token (REST)
# default_action = "merge"     # merge (local, as today) | create_mr
# push_branch_template = "{id}" # e.g. "feat/{issue}-{id}"; {id} {issue} {base}
# issue_pattern = "[A-Z]+-[0-9]+" # extracts a Linear/Jira key from the head
# draft = true                 # open MRs as draft
# squash = true                # request squash-on-merge
# delete_remote_branch = true  # tell the forge to delete on merge
# require_local_tests = true   # gate Publish on local [[tests]] like merge is
# auto_push = true             # automatically push after an MR is linked
# protected_branches = ["main"] # warn before a direct LOCAL merge into these

[resources]
io_read_bandwidth_max = 80
io_write_bandwidth_max = 40
