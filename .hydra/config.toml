[defaults]
pre_prompt = """
- Use bun instead of npm, and bun x instead of npx
- Check using mage build before committing"""

[defaults.sandbox]
writable_paths = ["~/.cache/go-build", "~/.go/pkg", "~/.bun/install/cache", "~/.cache/goimports", "~/.magefile"]

# Diff-viewer artifact generator (PLAN.md #17): renders Hydra's own web UI to
# PNGs so visual changes show up side-by-side in the diff viewer. The script
# builds the checkout's frontend, boots `hydra server --simulation` and
# screenshots several pages (home, the repository browser, agent diff views).
# Building Go + the frontend is slow, so allow a generous timeout (results are
# cached per resolved ref).
[[artifacts]]
name = "screenshots"
command = "cd scripts/screenshots && bun install && bun take-screenshot.ts"
timeout_sec = 900
