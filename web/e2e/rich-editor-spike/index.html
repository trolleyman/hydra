<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rich editor boundary spike</title>
    <style>
      body {
        margin: 40px;
        color: #292524;
        background: #fafaf9;
        font: 16px/1.5 system-ui, sans-serif;
      }
      #editor {
        width: 620px;
        min-height: 120px;
        padding: 16px;
        border: 1px solid #d6d3d1;
        border-radius: 12px;
        background: white;
      }
      .ProseMirror {
        min-height: 120px;
        outline: none;
        white-space: pre-wrap;
      }
      .ProseMirror p {
        margin: 0;
      }
      code[data-inline-code] {
        position: relative;
        display: inline-block;
        min-width: 0.25em;
        margin: 0 1px;
        padding: 0 4px;
        border: 1px solid #d6d3d1;
        border-radius: 5px;
        background: #f5f5f4;
        font: 0.92em/1.35 ui-monospace, monospace;
      }
      code[data-inline-code-caret="start"] { box-shadow: inset 1px 0 currentColor; }
      code[data-inline-code-caret="end"] { box-shadow: inset -1px 0 currentColor; }
    </style>
  </head>
  <body>
    <main>
      <h1>Inline code behavior spike</h1>
      <div id="editor"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
