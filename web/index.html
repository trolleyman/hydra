<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hydra</title>
    <!-- Every webfont the font selector offers except Iosevka and Iosevka Term,
         which have no Google Fonts entry and are self-hosted from public/fonts
         instead (see the @font-face block in src/index.css). The catalogue that
         must agree with this list is src/lib/fonts.ts.

         One stylesheet, not one per family: the response is ~3KB gzipped and a
         @font-face is only fetched when a glyph actually needs it, so listing
         nine families costs a single request and nothing else until someone
         picks one. display=swap shows the fallback until a face arrives, so text
         is never invisible and the app degrades gracefully offline.

         Two of these are load-bearing beyond the selector:
         - Merriweather is the default chat font. A pinned webfont keeps bold and
           regular metrics identical on every OS instead of relying on whatever
           serif the system substitutes.
         - Roboto Flex is the prompt/chat input box (HighlightedTextarea), which
           needs the `slnt` (slant) axis: the highlight backdrop slants *italic*
           runs while keeping the upright glyph advance widths, where a real
           cursive italic would be narrower and drift the (upright) caret.

         Weights are held to 400-700 (plus italics where the family has them) -
         that is everything the UI asks for, and the wider ranges quoted in
         Google's own snippets triple the stylesheet for faces nothing renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400..700&family=IBM+Plex+Mono:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Roboto+Flex:slnt,wght@-10..0,100..1000&family=Source+Code+Pro:ital,wght@0,400..700;1,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
