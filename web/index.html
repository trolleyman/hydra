<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hydra</title>
    <!-- Every webfont the font selector offers except Iosevka and Iosevka Term,
         which have no Google Fonts entry and are self-hosted from public/fonts
         instead (see the @font-face block in src/index.css). The catalogue that
         must agree with this list is src/lib/fonts.ts.

         One stylesheet, not one per family: the response is ~3KB gzipped and a
         @font-face is only fetched when a glyph actually needs it, so listing
         nine families costs a single request and nothing else until someone
         picks one. display=swap shows the fallback until a face arrives, so text
         is never invisible and the app degrades gracefully offline.

         Four of these are load-bearing beyond the selector:
         - Inter (interface), Merriweather (chat) and Fira Code (code AND
           terminal) are the four roles' defaults, so this stylesheet is what an
           untouched browser actually renders in. Pinned webfonts keep the
           metrics identical on every OS instead of relying on whatever the
           system substitutes; offline, display=swap leaves each role on the
           system stack behind it in src/lib/fonts.ts rather than blank.
         - Roboto Flex is the prompt/chat input box (HighlightedTextarea), which
           needs the `slnt` (slant) axis: the highlight backdrop slants *italic*
           runs while keeping the upright glyph advance widths, where a real
           cursive italic would be narrower and drift the (upright) caret.

         Weights are held to 400-700 (plus italics where the family has them) -
         that is everything the UI asks for, and the wider ranges quoted in
         Google's own snippets triple the stylesheet for faces nothing renders.

         These are SELF-HOSTED, not fetched from fonts.googleapis.com. The
         stylesheet below is Google's own - properly subsetted and split by
         unicode-range, so a browser still fetches only the blocks its text
         needs - mirrored into public/fonts/google/ by scripts/build-fonts.ts
         with its urls rewritten. Two reasons it is not a CDN link any more:
         Hydra is often reached with no usable egress (a sandbox, a LAN, a
         plane), where a render-blocking stylesheet on an unreachable host does
         not fail fast - it stalls the load; and a face that arrives late or not
         at all silently changes every text metric on the page, which is what
         made the screenshot diffs flap between real and fallback rendering. -->
    <link rel="stylesheet" href="/fonts/google.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
  </head>
  <body>
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
